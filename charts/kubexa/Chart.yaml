    # whole cluster. A tab appears only when the caller holds the permission AND
    # the grant names that surface; a denied surface hides its tab entirely
    # rather than showing a locked one, so a scoped collaborator is never
    # offered a door that answers 403. Owners are unaffected: an unrestricted
