apiVersion: v2
name: kubexa
description: "Kubexa — the whole platform in one release: API server, agentserver, telemetry consumer, the web UI, and the datastores and message bus they need (Postgres, Valkey, VictoriaMetrics, Loki, NATS), each of which can be turned off and pointed at your own."
type: application
version: 0.7.4
appVersion: "0.1.0"
keywords:
  - kubexa
  - observability
  - kubernetes
home: https://github.com/kubexa
sources:
  - https://github.com/kubexa/kubexa-backend
maintainers:
  - name: Kubexa
    url: https://github.com/kubexa
dependencies:
  # Component charts are pulled, never vendored. This chart adds the
  # infrastructure a bundled install needs and wires the components together
  # with values; it re-templates none of their objects.
  - name: kubexa-apiserver
    alias: apiserver
    # 0.4.0 is the first chart that can turn web push on at all: it adds the
    # notifications.webPush config block and the
    # KUBEXA_APISERVER_WEBPUSH_VAPID_PRIVATE_KEY env seam. Before it the only
    # way to deliver a VAPID private key was to hand-write the config Secret --
    # which is also the wrong place for it, since the private key must never
    # be rendered into config.
    #
    # 0.4.1 changes no template either: it moves appVersion to 0.4.0, the first
    # image that actually CONTAINS the web push seam and the cluster-silence
    # evaluator. On 0.4.0 the chart rendered every flag correctly and deployed
    # a 0.3.1 binary that had neither -- no crash, no error, just
    # {"enabled":false} and notifications that never arrive.
    #
    # 0.4.2 changes no template either: appVersion moves to 0.4.1, the first
    # image whose log explorer asks Loki to separate structured metadata. On
    # 0.4.0 the agent_id/agent_version columns render blank -- the values were
    # in Loki the whole time, folded into the stream labels.
    #
    # 0.4.3 changes no template either: appVersion moves to 0.5.0, the first
    # image with the per-cluster ingestion health endpoint and its RBAC
    # migration (0065). Apply 0065 before the pod restarts -- role grants
    # load once at boot, so a pod started before the migration 403s the new
    # route while telling the user they have the permission.
    #
    # 0.4.4 carries image 0.5.1, the first one that does not send a
    # cluster-silence notification to a suspended or deleted account. That
    # became a real consequence rather than a cosmetic one on 2026-08-14, when
    # web push went live: the notification is now an OS-level popup on a device
    # belonging to someone who has been shut out of the platform.
    #
    # 0.4.5 carries image 0.5.2, which holds a web push for an hour instead of
    # 60 seconds. Below that, a notification sent while the recipient's browser
    # was closed was dropped by the push service with nothing to show for it --
    # 2xx on the send, no log line, no delivery. First OS-level delivery on
    # this deployment was observed 2026-08-15 on 0.5.1, both silence and
    # recovery edges.
    #
    # 0.4.6 carries image 0.5.3, the first with the vmalert alert sink and its
    # two migrations (0066 alert RBAC, 0067 alert_state). vmalert itself is a
    # separate release in deployments/vmalert -- deliberately not bundled here,
    # because it is optional, it needs a datasource this chart does not own,
    # and it mounts a Secret key by name.
    #
    # 0.4.7 carries image 0.5.4 and migration 0068: the reaper that resolves
    # alert_state rows left stuck at 'firing' when vmalert restarts. It is
    # INERT until the KubexaAlertPipelineHeartbeat rule in deployments/vmalert
    # is posting -- without that row it cannot tell a cleared alert from a dead
    # sender, and declines to resolve anything.
    #
    # 0.4.8 carries image 0.5.5, which stops two notifications from saying
    # something untrue: a first sighting written 'resolved' announced as a
    # recovery (one spurious "Resolved: Alert pipeline is not reporting" per
    # fresh deployment), and a resolved body that repeated the firing
    # description under a "Resolved:" title. No migration.
    #
    # 0.4.9 carries image 0.5.6, the first that lets a recipient read the alert
    # they were notified about: GET /api/v1/alerts and /{fingerprint} behind a
    # new alert:read permission, and a notification link pointing at
    # /alert/{fingerprint} instead of /. Three migrations (0069 annotations +
    # assumed, 0070 alert:read and the Alerts menu row, 0071 annotations_at),
    # all applied by the migrate initContainer. Must move together with app
    # 0.1.9: this chart seeds the menu row and serves the routes, that one
    # carries the screens they feed.
    #
    # 0.4.10 carries image 0.5.7, which the agentserver has run since chart
    # 0.2.7 -- so this bump also ends a period where the namespace ran two
    # different builds of one binary. New for the apiserver: the notification
    # list gains read-state, type and date-range filters and a sort direction,
    # and two hard-delete routes appear (DELETE /me/notifications/{id} and
    # /me/notifications/read). The bulk route deletes READ rows only, by the
    # statement's own definition rather than by a parameter, so no request can
    # be shaped to remove an unread one. One migration, 0072, seeds
    # notifications:delete_own and grants it to user and admin; it must land
    # before the pod starts, because role grants load once at boot. Must move
    # together with app 0.1.13: this chart serves the routes, that one carries
    # the page that calls them.
    #
    # 0.4.11 carries no apiserver code change whatsoever. appVersion moves to
    # 0.5.8 only so both processes in the namespace run one image version --
    # all of 0.5.8's work is in the agentserver's delivery buffer, described
    # under agentserver 0.2.8 below. Skipping a bump like this is exactly what
    # produced the 0.5.0-vs-0.5.6 drift the 0.4.10 note above had to end.
    #
    # 0.4.12 changes templates only and never appeared in an umbrella release:
    # it adds the dead man's switch plumbing -- secrets.deadManURL delivered as
    # an env var (never the config Secret, matching the VAPID key) and
    # config.deadMan.{interval,timeout} rendered into apiserver.dead_man --
    # while appVersion stayed at 0.5.8, so the flags reached a binary that
    # reads neither.
    #
    # 0.4.13 changes no template: appVersion moves to 0.5.9, the first image
    # that CONTAINS the switch. The apiserver pings an external check on an
    # interval; the check alarms when the pings stop, which is the one failure
    # mode this platform could not report on itself -- an apiserver that is
    # down cannot tell anyone it is down.
    #
    # The URL is a SECRET and this chart's values are the wrong place for it:
    # whoever holds it can keep the check green and suppress the alarm. On this
    # deployment secrets.existingSecret is set, and on that path the apiserver
    # chart disables templates/secret-keys.yaml wholesale -- so setting
    # secrets.deadManURL here is silently ignored and the env var, being
    # optional, leaves the pod healthy with the switch disarmed. Put the URL in
    # the existing Secret under the key `dead-man-url`.
    #
    # Moves together with agentserver 0.2.9 below: one image, both processes.
    #
    # 0.4.14 changes no template: appVersion moves to 0.5.10, the first image
    # that serves the platform owner's ingestion view -- GET
    # /api/v1/admin/ingestion (the fleet: which clusters are losing data) and
    # its per-cluster detail. Both are gated on a new `ingestion:read_all`
    # permission, which users migration 0073 seeds along with the `ingestion`
    # module and the menu row that reaches the screens. The grant goes to admin
    # only: superadmin arrives through `*:*`, and `user` is deliberately left
    # out because the fleet answer crosses the tenant boundary, unlike the
    # existing per-cluster cluster:ingestion_read.
    #
    # Migration 0073 must land before the pod starts. Role grants load once at
    # boot, so an apiserver started ahead of it answers 403 on the new routes
    # while the UI says the permission is held -- the migrate initContainer
    # already orders this correctly.
    #
    # Moves with app 0.1.16, which carries the screens these routes feed, and
    # with agentserver 0.2.10: one image, both processes.
    #
    # The 0.4.14 artifact published on 2026-08-20 06:11 UTC carried a note
    # saying this image changed nothing on the apiserver. It was republished
    # the same day with the text above; the templates and appVersion are
    # identical in both.
    #
    # 0.4.15 changes no template: appVersion moves to 0.5.11. The fleet
    # ingestion response now carries the names behind its ids -- token_name
    # next to tenant_id (which is the owning TOKEN's row id, NOT a tenant),
    # namespace_slug next to namespace_id, and {cluster_id,label} pairs where
    # the namespace rows listed bare uuids -- plus an `identity` object on the
    # per-cluster detail route, so a reader arriving by URL can tell whose
    # cluster they are looking at. Purely additive; every 0.5.10 key is still
    # in the same place. Moves with app 0.1.17, which renders them.
    #
    # 0.4.16 changes no template: appVersion moves to 0.5.12, which adds one
    # field to the fleet ingestion response -- owner_name, on the cluster rows,
    # the namespace rows and the detail identity. 0.4.15 already carried
    # namespace_slug and the screen showed it as the owner, but a slug is not a
    # name: a personal namespace's slug is derived from the local-part of the
    # signup email, so on this deployment BOTH clusters read "info" -- a true
    # value and no answer to whose cluster it is. The name is resolved from
    # where it actually lives: organizations.name for an org namespace, else the
    # owning user's display_name, else their email.
    #
    # No migration and no new permission -- the routes and their
    # ingestion:read_all gate are unchanged since 0.4.14, so this release has no
    # ordering constraint of its own. Purely additive on the wire; every 0.5.11
    # key is still in the same place. Moves with app 0.1.18, which renders it.
    #
    # 0.4.17 changes no template: appVersion moves to 0.5.13, the first image
    # that serves the cluster monitoring screen -- GET .../metrics (the panel
    # catalog, read from VictoriaMetrics over a requested window),
    # .../metrics/summary (node, pod and namespace counts from the stored
    # state plus the agent's last telemetry) and .../metrics/pods.
    #
    # This one HAS an ordering constraint, unlike the last three. Users
    # migration 0074 seeds cluster:metrics_read and grants it to admin and
    # user; role grants load once at boot, so an apiserver started ahead of the
    # migration answers 403 on all three routes while the caller's own
    # permission list says they hold the right. The migrate initContainer
    # orders this correctly and this chart uses it.
    #
    # Moves with app 0.1.19, and this pair does NOT degrade gracefully: 0.5.12
    # serves none of the three routes, so an app at 0.1.19 against it shows the
    # tab and 404s on every panel.
    #
    # 0.4.18 changes no template: appVersion moves to 0.5.14, and this one has
    # THREE migrations, one of which decides how long the rollout takes.
    #
    # PUT /me/settings became a partial patch. It used to replace the settings
    # object wholesale -- invisible while `theme` was the only field, a
    # data-loss bug the moment there are two. `nav_favorites` is that second
    # field, an ordered list of menu module keys on the existing users.settings
    # JSONB, so no migration. Pair it with app 0.1.22 or later and DO NOT ship
    # that app against 0.5.13: the favorites editor sends `{nav_favorites: [...]}`
    # alone, an older apiserver reads that as the whole object and erases the
    # user's theme, and the next theme change erases their pins back.
    #
    # The cluster object change history: GET .../clusters/{tenant}/{cluster}/state/events
    # plus its histogram and coverage reads, a keyset-paged timeline of what
    # changed in a cluster, secrets masked. Users 0076 seeds cluster:events_read
    # on the existing `cluster` module and grants it to admin AND user. Role
    # grants load once at boot, so 0076 must land before the pod starts; the
    # migrate initContainer orders that. In THIS umbrella the timeline is no
    # longer inert -- app 0.1.23 is the screen that reads it.
    #
    # THE ONE TO PLAN FOR: app 0077 rebuilds the timeline index CONCURRENTLY,
    # outside a transaction. On apexcrawl that table is 2481 MB across 1.12M
    # rows, so the build takes real time and the migrate initContainer blocks
    # until it finishes -- the rollout WAITS, it does not fail. CONCURRENTLY is
    # deliberate: a transactional build holds a SHARE lock and the writer it
    # would block is the telemetry consumer, which under at-least-once delivery
    # stops acking rather than falling behind. 0077 drops 0075's index and
    # replaces it (same key, two INCLUDE columns), so the cost is 208 MB, not
    # 145 + 208.
    #
    # The resource catalog can now say a live read will be refused BEFORE the
    # click and name which gate refused it -- the cluster's RBAC or the agent's
    # own query.rules policy. It reads a `live_query` field this image writes
    # onto catalog rows from what consumer 0.1.2 stores there.
    #
    # Rolling back to 0.5.13 leaves cluster:events_read seeded and the rebuilt
    # index in place; the older binary ignores both. What it does NOT undo is
    # the settings contract -- roll the app back with it.
    #
    # 0.4.19 was published and then skipped by every umbrella until this one.
    # It puts GOMEMLIMIT on the template and makes the values schema REQUIRE a
    # unit suffix on goMemLimit: a bare "1600" or "0" used to validate and boot,
    # then GC continuously against the wrong soft limit, because the Go runtime
    # accepts a unitless GOMEMLIMIT without erroring. It now fails the render.
    #
    # 0.4.20 (image 0.5.15): scoped cluster access. A collaborator's grant is no
    # longer only a level -- it is a level plus an optional per-cluster access
    # profile naming which data SURFACES (logs, resources, events, metrics) they
    # may read and which namespace / pod / workload patterns bound each one.
    # Every authorization call site declares its surface, and a grant that cannot
    # evaluate a constraint fails closed. Three surfaces that used to be all-or-
    # nothing per cluster are now per-grant.
    #
    # THE ONE TO PLAN FOR: three users-database migrations ride along, and 0079
    # is an exposure event in its own words, not a bug fix. It grants
    # cluster:logs_read to the 'user' role, so every EXISTING collaborator whose
    # profile_id IS NULL -- which this feature reads as unrestricted -- gains log
    # access on any cluster they already had read access to, the day it runs.
    # Redaction is not built yet: those are raw, unredacted lines.
    #
    # AND THERE IS NO WINDOW. The apiserver's migrate initContainer runs
    # --db=all up during the pod's own startup, so `helm upgrade` applies all
    # three with nothing in between. Count the affected rows BEFORE upgrading:
    #
    #     SELECT count(*) FROM cluster_collaborators WHERE profile_id IS NULL;
    #
    # After the upgrade that query answers a different question.
    #
    # Rolling back to 0.4.18/0.5.14 leaves all three migrations applied. The
    # older binary ignores the profile tables, but 0079's grant STAYS -- the
    # initContainer only ever runs `up`, so the widened log access survives a
    # rollback until someone runs that migration's Down by hand.
    #
    # 0.4.21 changes no template: appVersion moves to 0.5.16, which closes the
    # three gaps the first live install of scoped access surfaced.
    #
    # ONE MIGRATION, users 0081, applied by the same initContainer with the
    # same absence of a window: it grants cluster:resource_live_read to the
    # 'user' role. Read it against 0079 above, because they look alike and are
    # opposites. 0079 widened what data a grant reaches. 0081 removes a gate
    # that was refusing the LEGITIMATE path: 0056 withheld this permission
    # because a live read could return unmasked Secret VALUES, and that
    # stopped being true once the secrets resource got its own gate
    # (LevelAdmin AND SurfaceAdmin, and SurfaceAdmin is not grantable by any
    # access profile). Live, that left a cluster OWNER on the default 'user'
    # role getting 200 from /resources and 403 from /live/resources on the
    # same cluster, and made the `resources` surface unusable.
    #
    # Also, needing no migration: an access profile that cannot compile into a
    # scope now degrades its own row in GET /me/clusters -- listed, marked
    # access_broken, given the deny-everything scope -- instead of failing the
    # whole list, and both pending-invitation lists carry profile_surfaces.
    #
    # No app floor: 0.1.27 reads neither field yet, and both are additive.
    #
    # Rolling back to 0.4.20/0.5.15 leaves 0081's grant in place, like 0079's.
    #
    # 0.4.22 carries image 0.5.17 and migration users 0083, which creates
    # plans.max_metric_series and namespace_plans.max_metric_series. The
    # consumer below needs those two columns; apply this chart's migration
    # before or with consumer 0.1.3. Out of order is not fatal -- the
    # consumer treats an unreadable ceiling as unknown, not as zero, and
    # keeps writing while counting the cause.
    #
    # It also puts `scrape_kinds` on the fleet ingestion contract, which app
    # 0.1.29 renders.
    #
    # 0.4.23 changes no template output under this chart's previous values:
    # it adds secrets.postgresAppPasswordSecret / postgresUsersPasswordSecret,
    # the {name, key} seam that lets the bundled Postgres's generated password
    # reach both the migrate initContainer and the server. Before it there was
    # no way to hand a subchart a password generated at render time, so the
    # bundled Postgres below could not have existed.
    #
    # 0.4.24 carries image 0.5.18, the metric catalog and discovery API: GET
    # metrics/names, GET metrics/labels and POST metrics/query_range under a
    # cluster. No migration and no new permission key -- all three reuse
    # cluster:metrics_read, the gate the monitoring routes already carry -- so
    # nothing has to be granted before the pod restarts. No floor against the
    # app chart in either direction: the UI that calls these routes is not
    # built, so installed without it they are simply never called.
    #
    # 0.4.25 carries image 0.5.19: the backup's configuration moves out of the
    # chart and into platform_settings, and the nightly run splits into a
    # system scope and a data scope. Three migrations run in the migrate
    # initContainer before the pod starts -- 0084 backup_runs, 0085 the backup
    # module with backup:read and the Platform menu row, 0086 that row to
    # 'coming_soon' because kubexa-app has no /platform route yet and every nav
    # route is derived as `/${moduleKey}`.
    #
    # Two routes appear: a BULK PUT on /api/v1/admin/platform/settings, which
    # is what makes a multi-field credential rotation possible at all, and GET
    # /api/v1/admin/backup/runs behind backup:read (admin only).
    #
    # No floor against the app chart in either direction.
    #
    # 0.4.26 changes no template: appVersion moves to 0.5.20, in which removing
    # a cluster stops being an HTTP request and becomes a background job. The
    # DELETE route marks the cluster purge_state='removing', enqueues a job and
    # answers 202; a worker inside the apiserver takes a Postgres advisory lock,
    # runs the steps in a pinned order and reports the outcome through the
    # notification centre. Inline, it answered 504 through Cloudflare -- one
    # step alone measured 58 seconds.
    #
    # Users migration 0087 adds kubexa_cluster_purge_jobs and must land before
    # the pod starts: the worker queries that table within 30 seconds of boot.
    # The migrate initContainer applies it, so a plain `helm upgrade` of this
    # umbrella is ordered correctly.
    #
    # The worker needs both databases and Redis, and deliberately NOT
    # notifications -- with those off it still removes clusters, it just tells
    # nobody. Nothing here exposes its tick interval, so an install runs the 30
    # second code default.
    #
    # App floor: this release pairs with app 0.1.34. An older app on this
    # apiserver simply shows no badge; a NEWER app on an older apiserver is the
    # broken direction, because purge_state does not exist in that response.
    # 0.4.27 carries image 0.5.21: alert rules a person writes, rate limits on
    # the public auth surface, and the two Explore settings fields the app's
    # stored board needs.
    #
    # An Explore panel can be saved as a rule that watches its own question. A
    # rule stores the QUESTION -- metric, matchers, aggregation, group-by, rate
    # window -- and never PromQL, so the query is rebuilt server-side each tick
    # and a rule can never smuggle in an expression. An evaluator ticks every
    # 60 seconds under a Postgres advisory lock, so several replicas produce
    # one evaluator, and runs a per-series state machine: breach for the rule's
    # duration fires, recovery resolves, and a series that stops reporting
    # resolves with different wording. A failed read is never a recovery -- a
    # VictoriaMetrics that is down leaves every firing alert where it was.
    #
    # It needs both databases, VictoriaMetrics and cluster authz, and does not
    # start without them; the boot log names which is missing. Nothing here
    # exposes alert_rules.eval_interval, so an install runs the 60 second code
    # default.
    #
    # Customer alerts share the alert_state table with vmalert's platform
    # alerts, separated by tenant_id / cluster_id / rule_id being set or NULL.
    # Four of this release's fixes are that boundary; the platform reaper used
    # to resolve still-firing customer alerts.
    #
    # Migrations 0078-0080 (app) and 0088 (users) land through the migrate
    # initContainer, so the umbrella is ordered correctly. 0088 is the one with
    # a human consequence: it grants cluster:alerts_read and
    # cluster:alerts_write, and permissions ride the session, so everyone
    # signed in across this upgrade must sign out and back in before the app's
    # Alerts tab does anything.
    #
    # Login, register and forgot-password are now rate limited by IP and by
    # account and fail CLOSED -- a Redis outage locks the guessable routes
    # rather than opening them -- while /auth/refresh fails open, because
    # failing it closed signs everybody out when Redis blinks.
    #
    # App floor: this release pairs with app 0.1.35, and that direction is the
    # strict one. A newer app on an older apiserver 404s on the rule routes and
    # shows an Alerts tab that can manage nothing.
    #
    # No integration test in the alert-rules workstream has run against a real
    # Postgres; Docker was unavailable throughout. Verified by unit tests and a
    # manual run against the dev database.
    # 0.4.28 carries image 0.5.22: an in-app support channel, and the work that
    # stops the alert evaluator falling over under load.
    #
    # A customer opens a ticket -- subject, category, an optional cluster, a
    # first message -- and the whole conversation lives in the product; there
    # is no mail step and no external tracker. Staff holding support:agent see
    # every ticket in one queue and reply, close and reopen from it. A ticket
    # carries two clocks: one orders the staff queue, the other the customer's
    # list, so an internal note can never lift a ticket for a customer with
    # nothing new to read.
    #
    # Users migrations 0089 and 0090 land through the migrate initContainer, so
    # the umbrella is ordered correctly. Two upgrade consequences, both
    # deliberate: permissions ride the session, so everyone signed in across
    # this upgrade sees no Support row until they sign out and back in; and
    # support:agent is GRANTED TO NO ROLE, so on a fresh upgrade only
    # superadmin reaches the queue and whoever is meant to answer tickets has
    # to be granted it explicitly.
    #
    # The evaluator now runs a tick's rules four at a time (four and not eight:
    # each database pool has max_conns 10, and eight would make ordinary HTTP
    # requests queue behind alert evaluation), resolves notification channel
    # preferences per tenant instead of per recipient, resolves a cluster's
    # recipient list once per tick, collapses a burst of more than three series
    # into one notification carrying a count and three samples, and refuses a
    # 201st rule in a namespace. Saturation moves from ~1200 rules to ~4800.
    # None of it is exposed as a chart value.
    #
    # Values gained one default: config.ratelimit.routes now carries POST
    # /api/v1/support/tickets at 5 requests per minute, keyed per TENANT rather
    # than per caller.
    #
    # App floor: this release pairs with app 0.1.36, and that direction is the
    # strict one. An older app leaves the support routes unreachable and
    # ignores an aggregate's count; a newer app on an older apiserver is the
    # broken direction, because the support routes do not exist there at all.
    #
    # Nothing in the support workstream has been installed or opened in a
    # browser.
    #
    # 0.4.29 carries image 0.5.23: menu headings (a `kind` column, a
    # `management` group, and the `users` row no migration had ever seeded --
    # /users gates on this catalogue, so that screen was unreachable even by
    # typed URL) plus provenance on platform settings. Install order inside
    # this umbrella is not a concern, because one `helm upgrade` applies both
    # subcharts; it matters only if someone installs the subcharts separately,
    # and the app chart is then the one that goes first.
    #
    # Still no path to KUBEXA_APISERVER_PLATFORM_SETTINGS_KEY in either chart:
    # /platform's non-secret fields work and every secret field answers
    # platform.no_encryption_key.
    #
    # 0.4.30 carries image 0.5.24: the Admin Control console's backend. One
    # `iam` module absorbs the roles and users screens, reverse queries answer
    # who holds a permission and where a user's access comes from, direct
    # per-user grants become writable, and an impact preview names who gains
    # and loses before a write. Every write recomputes the actor's own access
    # first: an operator revoking their own `role:manage` by any path,
    # wildcard included, gets 409 and nothing is written.
    #
    # Migrations 0096-0099 run in the migrate initContainer. 0099 deletes the
    # `rbac` and `users` menu rows the console replaces, so a rollback to
    # 0.5.23 needs 0099 and 0098 rolled back with it or the older app loses
    # both screens and gains a menu row it cannot route.
    #
    # 0.4.31 carries image 0.5.25 and changes no template. The menu write path
    # now validates the parent of every row: a group heading has no parent, a
    # link's parent is the root or a group. Before it, POST
    # /admin/menu/items/reorder accepted a cycle and the per-user menu tree
    # recursed over parent_id with no visited set -- a stack overflow on the
    # next GET /me/menu, for every user, until the row was fixed in SQL.
    # No migration; a rollback to 0.5.24 loses only the guard.
    #
    # 0.4.32 carries image 0.5.26 and adds one optional template surface:
    # `secrets.aiPlatformApiKey`, projected as
    # KUBEXA_APISERVER_AI_PLATFORM_API_KEY with `optional: true`, so an
    # install that ships before the key is set renders and boots as 0.5.25
    # did. The assistant itself ships OFF -- the `ai.enabled` platform
    # setting defaults false and with no key the service is never
    # constructed. Migrations 0108-0110 seed the `ai` module and `ai:use`
    # (admin and user), add ai_usage_events, and add the `refused` outcome.
    #
    # The same image carries a second feature its own chart note does not
    # mention: the platform member console's whole backend. /admin/members
    # and its detail, sessions, auth-events, activity and four report
    # endpoints, with migrations 0105 (the directory's sort index), 0106
    # (backfilling user_tokens.org_id so old token activity is not silently
    # absent from a member's history) and 0107, which seeds the `members`
    # module and member:read / member:activity / member:report, granted to
    # `admin`. It also makes login-as refuse a request that states no
