apiVersion: v2
name: kubexa
description: "Kubexa — the whole platform in one release: API server, agentserver, telemetry consumer, and the datastores/message bus they need."
type: application
version: 0.5.21
appVersion: "0.1.0"
keywords:
  - kubexa
  - observability
  - kubernetes
home: https://github.com/kubexa
sources:
  - https://github.com/kubexa/kubexa-backend
maintainers:
  - name: Kubexa
    url: https://github.com/kubexa
dependencies:
  # Component charts are pulled, never vendored. This chart adds the
  # infrastructure a bundled install needs and wires the components together
  # with values; it re-templates none of their objects.
  - name: kubexa-apiserver
    alias: apiserver
    # 0.4.0 is the first chart that can turn web push on at all: it adds the
    # notifications.webPush config block and the
    # KUBEXA_APISERVER_WEBPUSH_VAPID_PRIVATE_KEY env seam. Before it the only
    # way to deliver a VAPID private key was to hand-write the config Secret --
    # which is also the wrong place for it, since the private key must never
    # be rendered into config.
    #
    # 0.4.1 changes no template either: it moves appVersion to 0.4.0, the first
    # image that actually CONTAINS the web push seam and the cluster-silence
    # evaluator. On 0.4.0 the chart rendered every flag correctly and deployed
    # a 0.3.1 binary that had neither -- no crash, no error, just
    # {"enabled":false} and notifications that never arrive.
    #
    # 0.4.2 changes no template either: appVersion moves to 0.4.1, the first
    # image whose log explorer asks Loki to separate structured metadata. On
    # 0.4.0 the agent_id/agent_version columns render blank -- the values were
    # in Loki the whole time, folded into the stream labels.
    #
    # 0.4.3 changes no template either: appVersion moves to 0.5.0, the first
    # image with the per-cluster ingestion health endpoint and its RBAC
    # migration (0065). Apply 0065 before the pod restarts -- role grants
    # load once at boot, so a pod started before the migration 403s the new
    # route while telling the user they have the permission.
    #
    # 0.4.4 carries image 0.5.1, the first one that does not send a
    # cluster-silence notification to a suspended or deleted account. That
    # became a real consequence rather than a cosmetic one on 2026-08-14, when
    # web push went live: the notification is now an OS-level popup on a device
    # belonging to someone who has been shut out of the platform.
    #
    # 0.4.5 carries image 0.5.2, which holds a web push for an hour instead of
    # 60 seconds. Below that, a notification sent while the recipient's browser
    # was closed was dropped by the push service with nothing to show for it --
    # 2xx on the send, no log line, no delivery. First OS-level delivery on
    # this deployment was observed 2026-08-15 on 0.5.1, both silence and
    # recovery edges.
    #
    # 0.4.6 carries image 0.5.3, the first with the vmalert alert sink and its
    # two migrations (0066 alert RBAC, 0067 alert_state). vmalert itself is a
    # separate release in deployments/vmalert -- deliberately not bundled here,
    # because it is optional, it needs a datasource this chart does not own,
    # and it mounts a Secret key by name.
    #
    # 0.4.7 carries image 0.5.4 and migration 0068: the reaper that resolves
    # alert_state rows left stuck at 'firing' when vmalert restarts. It is
    # INERT until the KubexaAlertPipelineHeartbeat rule in deployments/vmalert
    # is posting -- without that row it cannot tell a cleared alert from a dead
    # sender, and declines to resolve anything.
    #
    # 0.4.8 carries image 0.5.5, which stops two notifications from saying
    # something untrue: a first sighting written 'resolved' announced as a
    # recovery (one spurious "Resolved: Alert pipeline is not reporting" per
    # fresh deployment), and a resolved body that repeated the firing
    # description under a "Resolved:" title. No migration.
    #
    # 0.4.9 carries image 0.5.6, the first that lets a recipient read the alert
    # they were notified about: GET /api/v1/alerts and /{fingerprint} behind a
    # new alert:read permission, and a notification link pointing at
    # /alert/{fingerprint} instead of /. Three migrations (0069 annotations +
    # assumed, 0070 alert:read and the Alerts menu row, 0071 annotations_at),
    # all applied by the migrate initContainer. Must move together with app
    # 0.1.9: this chart seeds the menu row and serves the routes, that one
    # carries the screens they feed.
    #
    # 0.4.10 carries image 0.5.7, which the agentserver has run since chart
    # 0.2.7 -- so this bump also ends a period where the namespace ran two
    # different builds of one binary. New for the apiserver: the notification
    # list gains read-state, type and date-range filters and a sort direction,
    # and two hard-delete routes appear (DELETE /me/notifications/{id} and
    # /me/notifications/read). The bulk route deletes READ rows only, by the
    # statement's own definition rather than by a parameter, so no request can
    # be shaped to remove an unread one. One migration, 0072, seeds
    # notifications:delete_own and grants it to user and admin; it must land
    # before the pod starts, because role grants load once at boot. Must move
    # together with app 0.1.13: this chart serves the routes, that one carries
    # the page that calls them.
    #
    # 0.4.11 carries no apiserver code change whatsoever. appVersion moves to
    # 0.5.8 only so both processes in the namespace run one image version --
    # all of 0.5.8's work is in the agentserver's delivery buffer, described
    # under agentserver 0.2.8 below. Skipping a bump like this is exactly what
    # produced the 0.5.0-vs-0.5.6 drift the 0.4.10 note above had to end.
    #
    # 0.4.12 changes templates only and never appeared in an umbrella release:
    # it adds the dead man's switch plumbing -- secrets.deadManURL delivered as
    # an env var (never the config Secret, matching the VAPID key) and
    # config.deadMan.{interval,timeout} rendered into apiserver.dead_man --
    # while appVersion stayed at 0.5.8, so the flags reached a binary that
    # reads neither.
    #
    # 0.4.13 changes no template: appVersion moves to 0.5.9, the first image
    # that CONTAINS the switch. The apiserver pings an external check on an
    # interval; the check alarms when the pings stop, which is the one failure
    # mode this platform could not report on itself -- an apiserver that is
    # down cannot tell anyone it is down.
    #
    # The URL is a SECRET and this chart's values are the wrong place for it:
    # whoever holds it can keep the check green and suppress the alarm. On this
    # deployment secrets.existingSecret is set, and on that path the apiserver
    # chart disables templates/secret-keys.yaml wholesale -- so setting
    # secrets.deadManURL here is silently ignored and the env var, being
    # optional, leaves the pod healthy with the switch disarmed. Put the URL in
    # the existing Secret under the key `dead-man-url`.
    #
    # Moves together with agentserver 0.2.9 below: one image, both processes.
    #
    # 0.4.14 changes no template: appVersion moves to 0.5.10, the first image
    # that serves the platform owner's ingestion view -- GET
    # /api/v1/admin/ingestion (the fleet: which clusters are losing data) and
    # its per-cluster detail. Both are gated on a new `ingestion:read_all`
    # permission, which users migration 0073 seeds along with the `ingestion`
    # module and the menu row that reaches the screens. The grant goes to admin
    # only: superadmin arrives through `*:*`, and `user` is deliberately left
    # out because the fleet answer crosses the tenant boundary, unlike the
    # existing per-cluster cluster:ingestion_read.
    #
    # Migration 0073 must land before the pod starts. Role grants load once at
    # boot, so an apiserver started ahead of it answers 403 on the new routes
    # while the UI says the permission is held -- the migrate initContainer
    # already orders this correctly.
    #
    # Moves with app 0.1.16, which carries the screens these routes feed, and
    # with agentserver 0.2.10: one image, both processes.
    #
    # The 0.4.14 artifact published on 2026-08-20 06:11 UTC carried a note
    # saying this image changed nothing on the apiserver. It was republished
    # the same day with the text above; the templates and appVersion are
    # identical in both.
    version: "0.4.14"
    repository: oci://ghcr.io/kubexa/charts
    condition: apiserver.enabled
  - name: nats
    version: "2.14.4"
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
  - name: kubexa-agentserver
    alias: agentserver
    # 0.2.2 changes no template: it exists only to move appVersion to 0.3.1 so
    # both processes run one image version in the namespace. A new default
    # image cannot ship under an already-published chart version.
    #
    # 0.2.3 does the same again for image 0.4.0 -- the apiserver chart moved
    # first, and one of the two moving alone is exactly what that rule exists
    # to prevent.
    #
    # 0.2.1 is the real floor -- it lifts nginx's client_max_body_size off the
    # agent stream. On 0.2.0 every agent reconnects once it has sent 1 MiB in
    # total: losslessly, but constantly.
    #
    # 0.2.4 does it a third time, for image 0.4.1.
    #
    # 0.2.5 does it a fourth time, for image 0.5.0 -- the agentserver's own
    # code did not change in this release; the chart moves only to keep both
    # processes on one image version in the namespace.
    #
    # 0.2.6 is the first one in this list since 0.2.1 that changes a template,
    # and it is the second half of the same defect 0.2.1 fixed. 0.2.1 lifted
    # nginx's SIZE cap off the agent stream; 0.2.6 lifts its TIME cap.
    # grpc_read_timeout (60s by default) counts from the last frame nginx read
    # from the UPSTREAM -- gateway->agent -- and the gateway sends nothing
    # periodic that way, so every stream died 60s after the last config push:
    # a session lifetime of exactly 90 seconds on this deployment, forever,
    # with nginx logging "upstream timed out while reading upstream" and the
    # agent seeing only RST_STREAM INTERNAL_ERROR. The agent's own heartbeat
    # cannot reset that timer -- it travels the other direction. appVersion is
    # unchanged: no image is needed for this.
    #
    # 0.2.7 changes no template: appVersion moves to 0.5.7, the first image
    # whose gateway acks an agent message only after every buffer item it
    # fanned out to has actually reached NATS. Before it, the agent's only
    # proof of delivery was stream.Send returning nil -- which means the bytes
    # entered an HTTP/2 send buffer, not that anyone received them -- and the
    # agent permanently deleted each batch on that proof, so every stream cut
    # silently lost what was in flight while every loss counter read zero.
    # Install this BEFORE moving any agent to 0.7.1: the agent only stops
    # trusting Send when this gateway's handshake announces delivery_acks, so
    # the reverse order holds every item to the agent's 10-minute cap and then
    # replays it.
    #
    # Two things to know before upgrading. First, appVersion sat at 0.5.0
    # through 0.2.5 and 0.2.6 while the apiserver above went to 0.5.6, so this
    # namespace has been running two different builds of one binary; every
    # gateway-side change since 0.5.0 -- per-(token, cluster) backpressure
    # targeting, pushed agent ingest rules, the per-cluster ingestion health
    # endpoint -- reaches a running agentserver for the first time here.
    # Second, 0.5.7 fixes a defect that had never worked in production: the
    # session registry kept only the LAST unregister callback of the three
    # registered, so the delivery tracker's session purge never ran and every
    # ended session leaked, and the heartbeat totals leaked with it.
    #
    # 0.2.8 changes no template: appVersion moves to 0.5.8. Install this
    # INSTEAD of 0.2.7, not after it -- 0.5.7 shipped the at-least-once path
    # with two defects that neither the test suite nor a quiet cluster
    # reaches, and both were found on this deployment.
    #
    # First, the publish worker's dequeue blocked until an item arrived, so
    # the same goroutine that owns the flush timer could sit in it
    # indefinitely. Under a real agent's load that starved the timer, nothing
    # was ever published, the tracker's ack never came, and the pipeline
    # deadlocked on its first live run on 2026-08-17 -- the agent had to be
    # rolled back to 0.7.0 the same day. Second, the shutdown drain called
    # FlushAll on the coalescer and never touched the queue, so every item
    # still queued at pod termination was left for the agent to replay. That
    # second one was invisible until the first was fixed: bounding the dequeue
    # is what opened the window in which the queue is unwatched.
    #
    # 0.5.8 also makes the outcome rule total: every buffer item now reaches
    # exactly one of published/dropped/abandoned and exactly one of queue
    # Ack/Nack. Zero outcomes stalled that agent for the rest of its session;
    # two meant the gateway both claimed delivery and kept the data.
    #
    # The 0.2.7 note below still applies in full, including the order rule:
    # install this BEFORE moving any agent to 0.7.1.
    #
    # 0.2.9 changes no template: appVersion moves to 0.5.9, the first image
    # whose heartbeat counters are keyed by (tenant, cluster) instead of by
    # session id. Cloudflare cuts an agent's gRPC stream at about 150 seconds,
    # so one agent process mints ~24 session ids an hour and every reconnect
    # re-added that agent's whole cumulative total: on this deployment
    # kubexa_gateway_agent_dropped_* read roughly 24x the truth -- 9
    # rate-limited records reported as 9,878. Expect every one of those series
    # to step DOWN to its real value at this upgrade. That is the fix landing,
    # not a regression, and any alert thresholded on the inflated numbers has
    # to be re-read afterwards.
    #
    # 0.2.10 changes no template: appVersion moves to 0.5.10, which takes the
    # ingest logging handler off the hot path. That handler is chained ahead of
    # the NATS handler for every log line, state event and metrics sample, and
    # it logged each one at info -- one JSON line written per ingested item. On
    # e12-preprod it ran while the gateway was already ~11.5 minutes behind
    # wall clock, longer than the agent's 10-minute inflight ack deadline, so
    # every delivered item was nacked and resent and the resends fed the lag.
    # Those lines are debug now; the counts stay in the buffer and NATS publish
    # counters. The same image also renames that entry's severity field to
    # entry_level -- zerolog writes its own severity under "level", so each
    # line carried two "level" keys.
    version: "0.2.10"
    repository: oci://ghcr.io/kubexa/charts
    condition: agentserver.enabled
  - name: kubexa-consumer
    alias: consumer
    # 0.1.1 changes no template: appVersion moves to 0.2.0, the first image
    # whose ingestion metrics carry a cluster_id label and rename the
    # namespace label to tenant_namespace. Any dashboard or alert reading the
    # old series breaks at the deployment instant -- expected, and covered
    # in the deployments runbook.
    version: "0.1.1"
    repository: oci://ghcr.io/kubexa/charts
    condition: consumer.enabled
  - name: kubexa-app
    alias: app
    # The web UI. Served same-origin with the apiserver: this chart's Ingress
    # claims / and the apiserver's claims /api/v1 on ONE host, which is what
    # lets the image be built once with a relative API base and installed
    # anywhere.
    #
    # 0.1.2 carries the notification inbox: the bell, the panel and the live
    # badge in both shells, plus the service worker that can display a web
    # push. Pinned in the same umbrella release as apiserver 0.4.1 on purpose
    # -- 0.4.1 is what first PRODUCES a notification, and a producer with no
    # surface to show it is not testable.
    #
    # 0.1.3 changes no template: appVersion moves to 0.2.0, the first image
    # with the cluster ingestion health tab.
    #
    # 0.1.4 likewise: appVersion moves to 0.2.1, the first image whose
    # notification preferences let a user turn web push on. Nothing in this
    # chart or the apiserver's has to change alongside it -- the cell follows
    # the vapid-public-key endpoint's own answer, so on a deployment with no
    # VAPID pair configured it correctly stays disabled.
    #
    # 0.1.5: appVersion 0.2.2 ships the four PWA icons the manifest has always
    # declared and never contained -- without a valid one the app cannot be
    # installed, and on iOS an installed app is the only thing that receives
    # web push. It also names the browser's own reason when a subscription is
    # refused rather than showing one generic error.
    #
    # 0.1.6: appVersion 0.2.3 puts the browser-push card above the preference
    # matrix. The card registers this device with the browser's push service;
    # the matrix only records intent, so a web_push cell flipped while the
    # card is off stores a preference nothing can deliver. With the gate
    # rendered below the thing it gates, both the user and the assistant
    # spent an hour toggling matrix cells while debugging why no subscription
    # ever reached the server.
    #
    # 0.1.7: appVersion 0.2.4 is the first build whose service worker can act
    # on a notification click at all. Before it the click raised the browser
    # and did nothing -- navigate() rejects on a client this worker does not
    # control, and the rejection skipped the openWindow fallback. Paired with
    # apiserver 0.4.8 on purpose: that release fixes what the notifications
    # SAY, this one fixes what happens when you touch them.
    #
    # 0.1.8: appVersion 0.2.5 is the first build whose notifications carry the
    # app's icon. Every one before it was branded with the browser's, because
    # no producer sets `icon` and the browser does not fall back to the site's
    # icon the way the code assumed. Frontend-only -- it needs no apiserver
    # version, though a producer may later override the default per payload.
    #
    # 0.1.9: appVersion 0.2.6 is the first build that renders an alert
    # notification as anything but the literal string `alert.firing`, and the
    # first with the alert list and detail screens its link resolves to. Unlike
    # every app bump above it, this one is NOT frontend-only in effect: the
    # screens call routes that only apiserver 0.4.9 serves, and the menu row
    # that reaches them is seeded by that release's migration. The two move
    # together or the release is broken in one direction or the other.
    #
    # 0.1.10: appVersion 0.2.7 is the first build whose alert LIST says what an
    # alert is about. 0.1.9 shipped the screens with the row's second line
    # rendering every label as `k=v`, truncated to one line, so on this very
    # deployment KubexaCertificateExpiringSoon -- twenty-odd cert-manager scrape
    # labels -- displayed its own heading back and nothing else. Frontend-only
    # this time: `annotations` were in the apiserver's list response all along,
    # so apiserver stays at 0.4.9.
    #
    # 0.1.11: appVersion 0.2.8 fixes two overflow defects that only using the
    # 0.2.7 screens against this cluster's own alerts could find. The alert
    # LIST scrolled sideways and carried its "Updated" column off the screen:
    # the row is a grid item, a grid item's automatic minimum is its
    # min-content, and the min-content of nowrap text is the entire string --
    # so the row was born as wide as the longest label line and the inner
    # `truncate` never got a chance to engage. The DETAIL page ran its label
    # values off the side for the sibling reason, a flex item refusing to
    # shrink below its own content. Frontend-only; apiserver stays at 0.4.9.
    #
    # 0.1.12: appVersion 0.2.9 carries two things. The service worker now calls
    # clients.claim() on activate: without it a newly activated worker controls
    # nothing -- not even the page whose load installed it -- and
    # notificationclick's client.navigate() is permitted only on a controlled
    # client, so a notification click opened a second tab beside the app
    # instead of steering the one already open. Measured on this deployment:
    # controller null on an `activated` worker with nothing waiting. Note this
    # is NOT established as the fix for the intermittent click failure (backlog
    # 1b.2); it closes one source of the variance. Second: the alert list
    # stacks into a card below sm, where the one-line row spent its width on
    # the badge and the timestamp and left the summary a few characters.
    # Frontend-only; apiserver stays at 0.4.9.
    #
    # 0.1.13: appVersion 0.2.10 adds the notification centre -- a full page
    # listing every notification, filterable by read state, type and date
    # range, sortable by date, with single and bulk delete. Deletes are hard,
    # with no undo; the bulk control deletes read notifications only and
    # honours the filters currently applied, so what the page shows is what it
    # removes. The page has deliberately NO menu entry and no ModuleGate:
    # notifications owns no `menu_items` row, so a gate would render it
    # permanently "unavailable". It is reached from the bell panel's footer
    # link. This one does NOT stay at the old apiserver -- it must move
    # together with apiserver 0.4.10, which serves the delete routes and seeds
    # the permission they are gated on.
    #
    # 0.1.14: appVersion 0.2.11 keeps the notification centre inside a phone
    # screen. 0.1.13 shipped it overflowing to the right, with the read/unread
    # badge and the Delete button off the edge -- found by using it on a phone,
    # which is the only way it could have been found: jsdom has no layout
    # engine, so every check the feature carried asserted markup and none of
    # them could see geometry. Three defects of one family, each measured in a
    # real engine before and after. A card widened by its own headline: a grid
    # item's automatic minimum is its min-content, the min-content of an
    # unbreakable token is the whole token, and no layer of the card carried
    # `min-w-0`. A table returning at `sm` while the shell stays a phone shell
    # until `md`, putting a ~750px five-column table inside a 640px viewport.
    # And a bell row whose box fitted while its text painted past it, which
    # getBoundingClientRect cannot see and only scrollWidth reports.
    # Frontend-only; the apiserver is untouched.
    #
    # 0.1.15: appVersion 0.2.12 is the release that actually settles backlog
    # 1b.2 -- a notification click now routes the tab you already have open.
    # 0.1.12's clients.claim() closed one source of the variance and was
    # explicitly not claimed as the fix; this is the fix. The worker's only
    # steering was client.navigate(), which the platform permits solely on a
    # client this worker CONTROLS, and control is handed over at the next
    # navigation -- so every tab open when a worker activates is unsteerable
    # and every click on it fell through to openWindow and a second tab. The
    # worker now asks the page over postMessage, which has no control
    # requirement, and focuses only once the page has answered: a tab on an
    # older build cannot answer, and a focused tab showing the wrong page is
    # worse than a new window. What this cannot fix, and what to expect on
    # this deployment: a tab still running 0.2.11 has no listener, so its
    # FIRST click after the upgrade still opens a new tab. One reload onto
    # 0.2.12 and it steers. Frontend-only; the apiserver is untouched.
    #
    # 0.1.16: appVersion 0.2.13 carries the platform owner's ingestion screens
    # and the shell chrome two page groups never had. The ingestion fleet and
    # detail screens are NOT frontend-only -- they call routes only apiserver
    # image 0.5.10 serves and reach them through a menu row that image's
    # migration seeds, so this moves together with apiserver 0.4.14 above. The
    # rest is: settings and the invitation screens now render inside the app
    # shell (settings had its own layout carrying only the user menu, so the AI
    # trigger and the bell vanished on every settings page, and the invitation
    # screens had no header at all -- the shared notification socket moved into
    # that layout too, so a badge arriving while you sit in settings no longer
    # freezes until the next refetch), and the log table stays inside its panel
    # instead of pushing the page sideways, which on a phone was an oscillation
    # that never settled.
    #
    # Image 0.2.13 was built and pushed by hand, as was backend 0.5.10: the
    # docker jobs in both repos are off until 2026-09-01. A chart bump in this
    # window points at nothing unless someone produces the image locally --
    # which is how chart 0.4.14 and 0.2.10 came to be published on 2026-08-20
    # against an image that did not exist for the first three hours of their
    # life.
    version: "0.1.16"
    repository: oci://ghcr.io/kubexa/charts
    condition: app.enabled
