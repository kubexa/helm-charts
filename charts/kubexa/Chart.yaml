apiVersion: v2
name: kubexa
description: "Kubexa — the whole platform in one release: API server, agentserver, telemetry consumer, and the datastores/message bus they need."
type: application
version: 0.5.3
appVersion: "0.1.0"
keywords:
  - kubexa
  - observability
  - kubernetes
home: https://github.com/kubexa
sources:
  - https://github.com/kubexa/kubexa-backend
maintainers:
  - name: Kubexa
    url: https://github.com/kubexa
dependencies:
  # Component charts are pulled, never vendored. This chart adds the
  # infrastructure a bundled install needs and wires the components together
  # with values; it re-templates none of their objects.
  - name: kubexa-apiserver
    alias: apiserver
    # 0.4.0 is the first chart that can turn web push on at all: it adds the
    # notifications.webPush config block and the
    # KUBEXA_APISERVER_WEBPUSH_VAPID_PRIVATE_KEY env seam. Before it the only
    # way to deliver a VAPID private key was to hand-write the config Secret --
    # which is also the wrong place for it, since the private key must never
    # be rendered into config.
    #
    # 0.4.1 changes no template either: it moves appVersion to 0.4.0, the first
    # image that actually CONTAINS the web push seam and the cluster-silence
    # evaluator. On 0.4.0 the chart rendered every flag correctly and deployed
    # a 0.3.1 binary that had neither -- no crash, no error, just
    # {"enabled":false} and notifications that never arrive.
    #
    # 0.4.2 changes no template either: appVersion moves to 0.4.1, the first
    # image whose log explorer asks Loki to separate structured metadata. On
    # 0.4.0 the agent_id/agent_version columns render blank -- the values were
    # in Loki the whole time, folded into the stream labels.
    #
    # 0.4.3 changes no template either: appVersion moves to 0.5.0, the first
    # image with the per-cluster ingestion health endpoint and its RBAC
    # migration (0065). Apply 0065 before the pod restarts -- role grants
    # load once at boot, so a pod started before the migration 403s the new
    # route while telling the user they have the permission.
    version: "0.4.3"
    repository: oci://ghcr.io/kubexa/charts
    condition: apiserver.enabled
  - name: nats
    version: "2.14.4"
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
  - name: kubexa-agentserver
    alias: agentserver
    # 0.2.2 changes no template: it exists only to move appVersion to 0.3.1 so
    # both processes run one image version in the namespace. A new default
    # image cannot ship under an already-published chart version.
    #
    # 0.2.3 does the same again for image 0.4.0 -- the apiserver chart moved
    # first, and one of the two moving alone is exactly what that rule exists
    # to prevent.
    #
    # 0.2.1 is the real floor -- it lifts nginx's client_max_body_size off the
    # agent stream. On 0.2.0 every agent reconnects once it has sent 1 MiB in
    # total: losslessly, but constantly.
    #
    # 0.2.4 does it a third time, for image 0.4.1.
    #
    # 0.2.5 does it a fourth time, for image 0.5.0 -- the agentserver's own
    # code did not change in this release; the chart moves only to keep both
    # processes on one image version in the namespace.
    version: "0.2.5"
    repository: oci://ghcr.io/kubexa/charts
    condition: agentserver.enabled
  - name: kubexa-consumer
    alias: consumer
    # 0.1.1 changes no template: appVersion moves to 0.2.0, the first image
    # whose ingestion metrics carry a cluster_id label and rename the
    # namespace label to tenant_namespace. Any dashboard or alert reading the
    # old series breaks at the deployment instant -- expected, and covered
    # in the deployments runbook.
    version: "0.1.1"
    repository: oci://ghcr.io/kubexa/charts
    condition: consumer.enabled
  - name: kubexa-app
    alias: app
    # The web UI. Served same-origin with the apiserver: this chart's Ingress
    # claims / and the apiserver's claims /api/v1 on ONE host, which is what
    # lets the image be built once with a relative API base and installed
    # anywhere.
    #
    # 0.1.2 carries the notification inbox: the bell, the panel and the live
    # badge in both shells, plus the service worker that can display a web
    # push. Pinned in the same umbrella release as apiserver 0.4.1 on purpose
    # -- 0.4.1 is what first PRODUCES a notification, and a producer with no
    # surface to show it is not testable.
    #
    # 0.1.3 changes no template: appVersion moves to 0.2.0, the first image
    # with the cluster ingestion health tab.
    #
    # 0.1.4 likewise: appVersion moves to 0.2.1, the first image whose
    # notification preferences let a user turn web push on. Nothing in this
    # chart or the apiserver's has to change alongside it -- the cell follows
    # the vapid-public-key endpoint's own answer, so on a deployment with no
    # VAPID pair configured it correctly stays disabled.
    #
    # 0.1.5: appVersion 0.2.2 ships the four PWA icons the manifest has always
    # declared and never contained -- without a valid one the app cannot be
    # installed, and on iOS an installed app is the only thing that receives
    # web push. It also names the browser's own reason when a subscription is
    # refused rather than showing one generic error.
    #
    # 0.1.6: appVersion 0.2.3 puts the browser-push card above the preference
    # matrix. The card registers this device with the browser's push service;
    # the matrix only records intent, so a web_push cell flipped while the
    # card is off stores a preference nothing can deliver. With the gate
    # rendered below the thing it gates, both the user and the assistant
    # spent an hour toggling matrix cells while debugging why no subscription
    # ever reached the server.
    version: "0.1.6"
    repository: oci://ghcr.io/kubexa/charts
    condition: app.enabled
