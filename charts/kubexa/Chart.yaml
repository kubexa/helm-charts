    # seeds the `members` row into the menu catalogue, a child of the
    # Management heading gated on member:read, pointing at /members in app
    # 0.2.38. A chart rollback runs no goose down, so the row survives one
    # and the older binary serves it unchanged.
    version: "0.4.33"
    repository: oci://ghcr.io/kubexa/charts
    condition: apiserver.enabled
