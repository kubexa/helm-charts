    # said nothing else, which reads as a click that did nothing. All four forms
    # swap their label for a pending sentence beside a spinner and disable their
    # fields until the exchange settles. And a combobox panel can no longer be
    # shifted off the left edge of the viewport: Radix computes its collision
    # shift against the wrapper it positions, while the panel declared a fixed
    # width read from a variable set only AFTER the size middleware runs, so the
