# Postgres off, the apiserver's host pointers moved but its Secret refs left
# behind. Must FAIL on the apiserver Postgres Secret-ref guard
# (templates/guards.yaml), not the host guard above it -- the host is moved
# specifically so that arm does not fire first.
postgres:
  enabled: false
apiserver:
  config:
    upstreams:
      postgres:
        app:
          host: pg.example.internal
        users:
          host: pg.example.internal
