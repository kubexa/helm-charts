# NATS off, both urls moved and the agentserver's Secret ref moved, but
# consumer.secrets.natsPasswordSecret.name left pointed at the bundled
# Secret. Must FAIL on the consumer NATS Secret-ref guard
# (templates/guards.yaml), the last NATS arm -- everything above it is moved
# specifically so those arms do not fire first.
nats:
  enabled: false
agentserver:
  config:
    nats:
      url: nats://nats.example.internal:4222
  secrets:
    natsPasswordSecret:
      name: ""
consumer:
  config:
    nats:
      url: nats://nats.example.internal:4222
