# NATS off, both urls moved but agentserver.secrets.natsPasswordSecret.name
# left pointed at the bundled Secret. Must FAIL on the agentserver NATS
# Secret-ref guard (templates/guards.yaml), not either url guard above it --
# both urls are moved specifically so those arms do not fire first.
nats:
  enabled: false
agentserver:
  config:
    nats:
      url: nats://nats.example.internal:4222
consumer:
  config:
    nats:
      url: nats://nats.example.internal:4222
