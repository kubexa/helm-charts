# backup.enabled=true, driver=filesystem, encryption Secret set (so that
# guard is satisfied) but no existingClaim named. This profile MUST fail to
# render: templates/guards.yaml refuses a filesystem destination with no PVC
# to mount -- without it the CronJob would have nowhere to write the dump.
backup:
  enabled: true
  encryption:
    existingSecret:
      name: kubexa-backup-encryption
  destination:
    driver: filesystem
