# Loki off, nothing else moved. This profile MUST fail to render: one of the
# Loki guards added in Task 7 (templates/guards.yaml) is the reason. The
# harness asserts the failure and its message, not a successful render.
loki:
  enabled: false
app:
  ingress:
    host: kubexa.example.com
apiserver:
  ingress:
    enabled: true
    host: kubexa.example.com
  config:
    corsAllowedOrigins:
      - https://kubexa.example.com
