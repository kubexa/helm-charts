# Postgres off, the apiserver fully moved and the consumer's host pointers
# moved too, but the consumer's Secret refs left behind. Must FAIL on the
# consumer Postgres Secret-ref guard (templates/guards.yaml), the last
# postgres-disabled host/secret arm -- everything above it is moved
# specifically so those arms do not fire first.
postgres:
  enabled: false
apiserver:
  config:
    upstreams:
      postgres:
        app:
          host: pg.example.internal
        users:
          host: pg.example.internal
  secrets:
    postgresAppPasswordSecret:
      name: ""
    postgresAppPassword: "app-password-example"
    postgresUsersPasswordSecret:
      name: ""
    postgresUsersPassword: "users-password-example"
consumer:
  config:
    postgres:
      host: pg.example.internal
    usersDb:
      host: pg.example.internal
