# backup.enabled=true, encryption Secret and platform key Secret both set
# (so those guards are satisfied), destination.driver set to something
# neither s3 nor filesystem supports.
# This profile MUST fail to render: templates/guards.yaml refuses any driver
# value the CronJob template's own {{- if eq ... }}/{{- else }} pair does not
# branch on, rather than silently falling through to the filesystem env vars
# for a driver that was never meant to use them.
backup:
  enabled: true
  encryption:
    existingSecret:
      name: kubexa-backup-encryption
  destination:
    driver: nfs
apiserver:
  secrets:
    platformKeySecret:
      name: kubexa-platform-settings-key
      key: platform-settings-key
