# The umbrella: one release for the whole platform.
#
# Every component can be turned off and pointed at something you already run.
# The reverse is also supported -- install the component charts directly and
# skip this one entirely.

global:
  imagePullSecrets: []

# ─── bundled datastore ──────────────────────────────────────────────────────
#
# Valkey, not Redis: protocol-compatible, so the client neither knows nor
# cares, but BSD-licensed under the Linux Foundation rather than RSALv2/SSPL,
# and with maintained images that are not behind a vendor subscription.
#
# Turn it off and set apiserver.config.upstreams.redis.addrs to your own.
valkey:
  enabled: true
  # A static name, not <release>-valkey: Helm does not template values.yaml, so
  # a release-derived name could not be written into the apiserver's values
  # below. The consequence is one umbrella release per namespace; change this
  # and the addrs entry together if you need two.
  serviceName: kubexa-valkey
  image: valkey/valkey:8.1-alpine
  port: 6379
  # Generated on first install and preserved across upgrades. Set it to pin.
  password: ""
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── bundled relational store ───────────────────────────────────────────────
#
# One Postgres, two databases: kubexa_app (telemetry, clusters, alerts) and
# kubexa_users (identity, RBAC, audit). The apiserver and the consumer each
# hold both as separate upstreams with separate credentials, so this chart
# creates two roles rather than one shared user -- the users database holds
# password hashes and refresh tokens and does not need to be readable by the
# code that writes telemetry.
#
# Single replica, no HA. That is the honest scope: a self-hosted install that
# needs failover should turn this off and point at a managed Postgres or a
# CloudNativePG cluster. Backups are A0.3's subject, not this chart's.
#
# Turn it off and set apiserver.config.upstreams.postgres.{app,users}.host --
# and sslMode back to `require` -- to your own instance.
postgres:
  enabled: true
  # A static name, not <release>-postgres: Helm does not template values.yaml,
  # so a release-derived name could not be written into the apiserver's and
  # consumer's values below. Same rule as valkey.serviceName and the bundled
  # NATS -- one umbrella release per namespace.
  serviceName: kubexa-postgres
  # 17-alpine: the image the migrations are tested against, and the last
  # major with a maintained alpine variant at the time of writing. Pin the
  # major -- a silent jump to 18 on a StatefulSet whose PVC holds a 17 data
  # directory is a pod that will not start, with the reason only in its log.
  image: postgres:17-alpine
  port: 5432
  # Generated on first install and preserved across upgrades. Set to pin.
  # These are the values written into kubexa-postgres-auth; the apiserver and
  # the consumer read them from that Secret by reference, never by value.
  superuserPassword: ""
  appPassword: ""
  usersPassword: ""
  # The two database names, matching kubexa-apiserver's own defaults
  # (helm/kubexa-apiserver/values.yaml: config.upstreams.postgres.*.database).
  # Changing one here means changing it in apiserver.config and
  # consumer.config below, in the same commit.
  appDatabase: kubexa_app
  usersDatabase: kubexa_users
  appUser: kubexa_app
  usersUser: kubexa_users
  persistence:
    enabled: true
    storageClass: ""
    # Telemetry rows, not chunks: the metric and log bodies live in
    # VictoriaMetrics and Loki. 20Gi is a starting value, not a measurement --
    # A0.4's sizing guide is where a real number comes from. A PVC cannot be
    # shrunk in place, so err small and grow.
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

# ─── bundled message bus ────────────────────────────────────────────────────
#
# NATS JetStream: the telemetry pipeline's spine. The agentserver publishes to
# it, the consumer pulls from it. R1 only -- config.cluster is left at the
# chart's own default (disabled) and this umbrella adds no replica count of
# its own; a clustered JetStream is out of scope until the pipeline has run
# long enough in production to justify it.
#
# Turn it off and point agentserver.config.nats.url / consumer.config.nats.url
# at your own NATS instance.
nats:
  enabled: true
  # A static name, not <release>-nats: Helm does not template values.yaml, so
  # a release-derived name could not be written into
  # agentserver.config.nats.url / consumer.config.nats.url below. Without
  # this, a release named anything other than "kubexa" renders a Service
  # named "<release>-nats" while those values still say "kubexa-nats", and
  # both the agentserver and the consumer connect to nothing. The consequence
  # is one umbrella release per namespace, the same rule valkey.serviceName
  # already follows -- change this and the two url entries together if you
  # need a second bundled install in one namespace.
  fullnameOverride: kubexa-nats
  # Generated on first install and preserved across upgrades. Set it to pin.
  password: ""
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          # Starting value, not a measurement -- same caveat as
          # agentserver.config.nats.jetstream.maxBytes below (8Gi). Read the
          # stream's real growth with `nats stream info` once the pipeline is
          # live and revise both together: templates/guards.yaml fails the
          # render if maxBytes reaches or exceeds this size, because a stream
          # that fills its configured byte limit before the volume behind it
          # fills is one failure mode, and a volume that fills first while
          # JetStream still thinks it has headroom is the other -- either way
          # the two numbers drifting apart is a silent trap, not a tradeoff.
          size: 16Gi
    # Static-user auth, following the pattern documented in the upstream
    # chart's own values.yaml (config.merge / container.env). The password
    # itself is never a value here -- it arrives only as $NATS_PASSWORD, from
    # the Secret templates/nats-secret.yaml generates, and is substituted into
    # the rendered nats.conf by the NATS chart's own "<< $VAR >>" convention.
    merge:
      authorization:
        user: kubexa
        password: << $NATS_PASSWORD >>
  container:
    env:
      NATS_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: kubexa-nats-auth
            key: password
  # The bundled nats-box: this is what `nats stream info`, `nats stream ls`
  # etc. run against once you `kubectl exec` into it, and it is also the pod
  # `helm test` runs. Verified empirically (a throwaway nats-server + nats-box
  # pair run locally) that the NATS CLI's context.json does NOT expand `$VAR`
  # tokens the way nats-server's own config parser does -- a literal
  # "password": "$NATS_PASSWORD" in a context file is sent to the server
  # as-is and rejected with an Authorization Violation. What DOES work,
  # confirmed the same way: the CLI's global --user/--password flags bind to
  # the NATS_USER/NATS_PASSWORD environment variables (its own --help says so:
  # "--password=PASSWORD Password ($NATS_PASSWORD)") and take priority over
  # whatever the selected context says, printing "WARNING: Shell environment
  # overrides in place using NATS_PASSWORD" and connecting successfully. So
  # the context below only carries the (non-secret) username, and the actual
  # credential arrives as an env var sourced from the same generated Secret
  # the main NATS container reads -- by reference, never a value here.
  natsBox:
    contexts:
      default:
        merge:
          user: kubexa
    container:
      env:
        NATS_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: kubexa-nats-auth
              key: password

# ─── bundled metric store ───────────────────────────────────────────────────
#
# VictoriaMetrics, single node. The consumer remote-writes agent telemetry
# into it and the apiserver reads it back for the cluster metric screens.
#
# Settings taken from deployments/vm/values.yaml, which was itself
# reconstructed from a live release -- see that file's header and README.
#
# Turn it off and set consumer.config.victoriaMetrics.url and
# apiserver.config.upstreams.victoriametrics.url to your own instance.
victoriaMetrics:
  enabled: true
  server:
    # Static name, same rule as every other bundled store: the URLs below are
    # plain values and Helm does not template values.yaml. This chart's own
    # "vm.plain.fullname" helper always suffixes a top-level fullnameOverride
    # with "-server" (the appKey every server-* template renders under), so
    # a top-level victoriaMetrics.fullnameOverride here would still produce a
    # Service named "kubexa-victoriametrics-server" -- confirmed by rendering
    # both ways. Setting it here, under server, is what actually pins the
    # name to the unsuffixed "kubexa-victoriametrics" every object below
    # (ServiceAccount, Service, StatefulSet) renders with.
    fullnameOverride: kubexa-victoriametrics
    # 30 days. VM enforces retention itself -- there is no compactor to
    # configure and no equivalent of Loki's retention_period/compactor split.
    retentionPeriod: 30d
    persistentVolume:
      enabled: true
      # A starting value, not a measurement: the live install holds 25.6 MB
      # after 50 days on a 50Gi volume. A0.4's sizing guide is where a real
      # number comes from. A PVC cannot be shrunk in place.
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # OFF, unlike deployments/vm/values.yaml. That flag makes VM scrape the
    # cluster itself, which creates a CLUSTER-SCOPED ClusterRole and
    # ClusterRoleBinding named after the release -- in a chart whose whole
    # premise is a self-contained namespace install, and in a cluster where
    # deployments/vm/README.md records a cluster-scoped name collision going
    # wrong once already. Collection belongs to the agent (roadmap C1); this
    # is a store.
    scrape:
      enabled: false

# ─── bundled log store ──────────────────────────────────────────────────────
#
# Loki, single binary on a filesystem PVC. The consumer pushes agent logs into
# it and the apiserver reads them back for the log explorer.
#
# Settings taken from deployments/loki/values.yaml, which was proved end to
# end -- boot, ingest, compaction, retention, deletion -- before it was
# written. Read that file's README before changing any of them.
#
# Why filesystem and not object storage: Loki fetches many chunks per query,
# so an object store pays its latency per chunk per query. Below roughly
# 1 TB/day a single binary on a local volume is both faster and simpler. The
# loki.storage switch stays reachable if that changes; nothing here is built
# for it.
#
# Turn it off and set consumer.config.loki.url and
# apiserver.config.upstreams.loki.url to your own instance.
loki:
  enabled: true
  fullnameOverride: kubexa-loki
  # fullnameOverride alone is not enough: this chart's "loki.name" helper
  # (default "loki") -- not "loki.fullname" -- names the headless Service
  # (single-binary/service-headless.yaml: "{{ include \"loki.name\" .
  # }}-headless") and the generated config ConfigMap
  # (values.yaml's loki.generatedConfigObjectName default:
  # '{{ include "loki.name" . }}'). Left at the chart default those two
  # objects render as "loki-headless" and "loki" -- unprefixed, colliding
  # with any other release named "loki" in the namespace, and in the
  # headless Service's case naming something the StatefulSet's own
  # "serviceName: {{ include \"loki.singleBinaryFullname\" . }}-headless"
  # (which DOES honor fullnameOverride) does not actually point at:
  # "kubexa-loki-headless" resolving to nothing. nameOverride pins
  # "loki.name" to the same "kubexa-loki" root so every name it drives
  # lines up with fullnameOverride's. Verified against the render: every
  # object this subchart produces now carries a "kubexa-loki" prefix (see
  # tests/render.sh's assert_bundled_loki, which checks the headless
  # Service by name).
  nameOverride: kubexa-loki
  deploymentMode: SingleBinary
  loki:
    # Multi-tenancy ON. Every push and query carries X-Scope-OrgID, and the id
    # is the customer's namespace id. With auth off, a single-tenant query
    # path returns every tenant's logs and nothing errors.
    auth_enabled: true
    image:
      # Pinned ABOVE the chart's own appVersion (7.2.0 ships 3.6.11), matching
      # the version deployments/loki runs.
      tag: "3.7.2"
    commonConfig:
      path_prefix: /var/loki
      # 1, not the chart default of 3: one replica cannot replicate to itself,
      # and the ring reports itself unhealthy forever if asked to.
      replication_factor: 1
    storage:
      type: filesystem
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules
    querier:
      multi_tenant_queries_enabled: true
    schemaConfig:
      configs:
        - from: "2026-08-06"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    compactor:
      working_directory: /var/loki/compactor
      # The whole feature. Without retention_enabled nothing is ever deleted,
      # no matter what limits_config.retention_period says.
      retention_enabled: true
      # Mandatory in Loki 3, not delete-API-only: the process refuses to start
      # with retention enabled and no delete_request_store.
      delete_request_store: filesystem
      compaction_interval: 10m
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
    limits_config:
      retention_period: 720h
      retention_stream: []
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 10MB
      max_streams_per_user: 10000
      max_global_streams_per_user: 10000
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      volume_enabled: true
    query_range:
      # OFF, against the chart default of true. The log explorer's histogram
      # computes its own bucket grid; Loki re-aligning ranges onto absolute
      # step multiples shifts every point off it and the bars stop matching
      # the rows.
      align_queries_with_step: false
    # The runtime_config hook, wired and empty. Per-tenant limits are written
    # into it at runtime and Loki reloads it live.
    runtimeConfig: {}
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
      # The chart would otherwise delete the PVC when the StatefulSet is
      # deleted or scaled -- a helm uninstall would take the logs with it.
      enableStatefulSetAutoDeletePVC: false
      whenDeleted: Retain
      whenScaled: Retain
  # Every other deployment mode's replicas at zero: SingleBinary is a mode,
  # but the chart still renders the SimpleScalable components unless each is
  # explicitly emptied.
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  gateway:
    enabled: false
  sidecar:
    rules:
      enabled: false
  # Namespaced, not cluster-scoped: this chart installs into one namespace and
  # a cluster-scoped name collision is what went wrong on this install once
  # already (deployments/loki/README.md).
  rbac:
    namespaced: true

# ─── bundled alerting ───────────────────────────────────────────────────────
#
# vmalert, evaluating the platform's own alert rules against the bundled
# VictoriaMetrics and posting firing/resolved state straight to the
# apiserver's /internal/alertmanager route (no Alertmanager in this path --
# see deployments/vmalert/README.md for why, and for every rule's own
# reasoning: the counter pattern, the absence-fallback trap, and the
# zero-vs-absent gauge guard on LokiRetentionStalled).
#
# A separate release in deployments/vmalert until 2026-09-27, for three
# reasons stated on the apiserver dependency's 0.4.6 comment above: it was
# optional, it needed a datasource this chart did not own, and it mounted a
# Secret key by name. All three are void now that this chart bundles
# victoria-metrics-single above and every component lives in one namespace.
#
# Default OFF, unlike victoriaMetrics/loki/nats: it needs
# apiserver.secrets.internalToken set, which this chart never generates (see
# that value's own comment -- holding the token IS the authorization).
# Turning this on without it mounts a Secret with no internal-token key in
# it and vmalert authenticates against nothing. Turn it on and the apiserver
# route it posts to is mounted for free the moment that value is set.
#
# The rules below are copied verbatim from deployments/vmalert's
# values-apexcrawl.yaml as it stood the day this was bundled -- same
# datasource/notifier URLs, same Secret name, same 19 rules across 8
# groups. That file now carries only vmalert.enabled: true.
vmalert:
  enabled: false
  server:
    # The umbrella release's own VictoriaMetrics, in this same namespace. Since
    # the rebuild, deployments/kubexa/values-apexcrawl.yaml no longer states this
    # address at all -- it is the umbrella's default and the apiserver, the
    # consumer and this file all inherit it. If it ever moves, it moves in the
    # chart, and all three follow.
    #
    # The address alone is not enough, and this is the part that is easy to miss:
    # VM must be SCRAPING, which is off in the umbrella's defaults and turned on
    # explicitly in deployments/kubexa/values-apexcrawl.yaml. With scraping off,
    # VM holds only what the consumer remote-writes and every rule below except
    # the heartbeat evaluates against an empty series set -- while
    # KubexaTargetAbsent fires CRITICAL because nothing is there at all.
    datasource:
      url: http://kubexa-victoriametrics:8428

    # `for`-state persistence across restarts. remoteWrite publishes each active
    # alert's start time as the ALERTS_FOR_STATE series; remoteRead reads it back
    # on start. Without them, a pod replacement restarts every `for` timer from
    # zero, so KubexaVolumeFilling needs a further 15 uninterrupted minutes to
    # fire after any restart -- an alert delayed by the act of editing an
    # unrelated rule.
    #
    # These do NOT fix the stuck-firing problem in the README's run log, and it
    # is worth being exact about why, because the flag names suggest otherwise.
    # Restore only back-dates an alert the CURRENT evaluation has already
    # re-created: it walks the rule's in-memory pending alerts and moves their
    # start time backwards. An alert whose condition cleared while vmalert was
    # down is re-created by nothing, so there is nothing to restore and no
    # resolve is ever sent. Measured on 2026-08-15 with these very settings: a
    # firing rule flipped off across a restart produced no resolve at `for: 0m`
    # and none at `for: 1m`, while a rule that still matched logged
    # `restored to state at ...` and skipped its wait. Restore works; it just
    # answers a different question.
    #
    # The apiserver-side fix (reaping alert_state rows that stop being
    # re-asserted) is therefore still required and still unwritten.
    #
    # Both point at the same VictoriaMetrics the rules are evaluated against.
    # vmalert appends the paths itself (/api/v1/write and /api/v1/query), which
    # is why these stop at the host, exactly like datasource.url above.
    remoteWrite:
      url: http://kubexa-victoriametrics:8428
    remoteRead:
      url: http://kubexa-victoriametrics:8428

    notifier:
      # vmalert appends /api/v2/alerts to this base, which is why the path stops
      # at /internal/alertmanager. The apiserver route is registered at the full
      # path and is NOT an Alertmanager: it implements this one endpoint and
      # nothing else of that API.
      url: http://kubexa-apiserver.kubexa.svc:8080/internal/alertmanager
      # bearerTokenFile, never bearerToken. The chart renders bearerToken into a
      # container argument, which puts the credential in the Pod spec where
      # anyone with `get pods` can read it. The file form keeps it in the Secret
      # it came from.
      bearerTokenFile: /etc/kubexa/internal-token/internal-token

    extraVolumes:
      - name: internal-token
        secret:
          secretName: kubexa-apiserver-keys
          # Only the one key is projected. The Secret also holds the VAPID
          # private key, both Postgres passwords and the auth symmetric key, and
          # mounting it whole would put every one of them in this pod's
          # filesystem for no reason.
          items:
            - key: internal-token
              path: internal-token

    extraVolumeMounts:
      - name: internal-token
        mountPath: /etc/kubexa/internal-token
        readOnly: true

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

    # This note is about the Loki group specifically -- it predates this branch
    # and originally sat directly above those rules, back when they were the
    # only rules here. The config block below now holds 19 rules across 7
    # groups, with Loki last rather than first, so the note stays attached to
    # the block instead of drifting down with the group it actually describes.
    #
    # The two alerts deployments/loki/README.md listed as required when Loki
    # was installed -- the volume rule moved out to the platform group as
    # KubexaVolumeFilling. The two that remain here (LokiRetentionStalled,
    # LokiDiscardingLines) read two metrics between them, not four -- "all four"
    # was true only while the volume rule still lived in this group. They could
    # not be evaluated until VictoriaMetrics scraping went on (2026-08-10); both
    # metrics they read now exist.
    #
    # Every `for:` below is chosen from the shape of its own condition. None of
    # them is a default.
    config:
      alerts:
        groups:
          # The heartbeat is not an alert. It is the signal that lets the
          # apiserver tell "vmalert is alive and no longer asserting that alert"
          # apart from "vmalert is gone" -- a distinction it cannot otherwise
          # make, because when nothing is firing vmalert posts nothing at all.
          #
          # The apiserver records its row and never notifies it (the name is
          # matched against apiserver.alerts.heartbeat_alert_name), then measures
          # every other firing alert's staleness against this row's freshness
          # rather than against the clock. That is what stops a vmalert outage
          # from resolving every firing alert at once and telling everyone the
          # platform recovered.
          #
          # DELETING THIS RULE DOES NOT JUST REMOVE A HEARTBEAT. It silently
          # disables stale-alert reaping altogether -- the row the apiserver
          # reads is never written, its reap predicate matches nothing, and
          # alert_state rows go back to sticking at 'firing' forever, which is
          # the exact failure this whole mechanism exists to fix. Renaming it
          # here without renaming heartbeat_alert_name has the same effect.
          - name: pipeline
            rules:
              - alert: KubexaAlertPipelineHeartbeat
                expr: vector(1) > 0
                for: 0m
                labels:
                  severity: none
                  component: kubexa
                annotations:
                  summary: "Alert pipeline heartbeat"
                  description: "Always firing. Its freshness is how the apiserver knows vmalert is still posting."

          # ------------------------------------------------------------------
          # platform — the cluster underneath Kubexa.
          #
          # These rules are deliberately NOT scoped to the kubexa namespaces.
          # apexcrawl is a small shared cluster: a full volume or a dead
          # node-level target degrades everything on it, and seven PVCs is not
          # a volume of noise. `redis-data-redis-master-0` belongs to another
          # application and is watched on purpose. If the cluster grows or
          # ownership separates, the selectors here are the one place to narrow.
          # ------------------------------------------------------------------
          - name: platform
            rules:
              # up == 0 means the target IS discovered and its /metrics call
              # failed. It cannot see a pod that was deleted, evicted or never
              # scheduled: no target, no series, nothing to compare against.
              # That case is KubexaTargetAbsent below. The two are separate
              # rules because they are separate failures with the same symptom.
              - alert: KubexaTargetDown
                expr: up == 0
                for: 5m
                labels:
                  severity: critical
                  component: platform
                annotations:
                  summary: "Scrape target {{ $labels.job }} is not responding"
                  description: "{{ $labels.instance }} has failed every scrape for 5 minutes. Its metrics are stale, so every other rule reading them is blind for as long as this lasts."

              # absent() is the only construct that turns an expectation into an
              # alert, and it requires the expectation to be written down --
              # which is why these four services are named literally. Each
              # absent() call carries its own selector's equality matchers as
              # labels, so this one rule produces four distinguishable alerts
              # rather than one ambiguous row (verified live 2026-08-16).
              #
              # ADDING A SERVICE TO THE PLATFORM MEANS ADDING A LINE HERE.
              # Nothing else notices that a deployment stopped existing.
              - alert: KubexaTargetAbsent
                expr: |
                  absent(up{namespace="kubexa", app_kubernetes_io_name="apiserver"})
                    or absent(up{namespace="kubexa", app_kubernetes_io_name="agentserver"})
                    or absent(up{namespace="kubexa", app_kubernetes_io_name="consumer"})
                    or absent(up{namespace="kubexa", app_kubernetes_io_name="kubexa-loki"})
                for: 10m
                labels:
                  severity: critical
                  component: platform
                annotations:
                  summary: "{{ $labels.app_kubernetes_io_name }} has no scrape target at all"
                  description: "Nothing in namespace {{ $labels.namespace }} answers as {{ $labels.app_kubernetes_io_name }}. The pod is gone rather than unhealthy -- deleted, evicted, or never scheduled."

              # Replaces LokiVolumeFilling, which ran this same expression
              # against one PVC. Keeping both would report Loki twice.
              #
              # 15m because a volume dips across the line transiently while a
              # compactor works; a single scrape crossing 75% is not yet news.
              - alert: KubexaVolumeFilling
                expr: |
                  kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.25
                for: 15m
                labels:
                  severity: warning
                  component: platform
                annotations:
                  summary: "{{ $labels.persistentvolumeclaim }} is over 75% full"
                  description: "Only {{ $value | humanizePercentage }} of {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is free. Writes to it stop when it fills."

              # A volume with free bytes and no free inodes is full in every way
              # that matters, and the byte rule above cannot see it. 15% rather
              # than 25%: inode exhaustion arrives abruptly, so a wider margin
              # would only add noise without adding warning.
              - alert: KubexaVolumeInodesFilling
                expr: |
                  kubelet_volume_stats_inodes_free / kubelet_volume_stats_inodes < 0.15
                for: 15m
                labels:
                  severity: warning
                  component: platform
                annotations:
                  summary: "{{ $labels.persistentvolumeclaim }} is running out of inodes"
                  description: "Only {{ $value | humanizePercentage }} of the inodes on {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} are free. Writes fail with ENOSPC while free bytes remain."

              # The primary certificate signal: it reports renewal FAILING
              # rather than its eventual consequence.
              #
              # NOTE the namespace labels, they are the easiest mistake in this
              # file. VictoriaMetrics adds its own `namespace` (where the
              # cert-manager POD runs, always "cert-manager") and moves the
              # target's colliding label to `exported_namespace` (where the
              # CERTIFICATE lives). Templating $labels.namespace here would
              # name cert-manager on every single alert.
              #
              # condition!="True", NOT condition="False". cert-manager emits
              # three series per certificate -- False, True and Unknown -- and
              # a certificate wedged at Unknown (a common shape for a stuck ACME
              # challenge) is exactly the renewal failure this rule exists to
              # catch. Matching only "False" makes that case invisible.
              - alert: KubexaCertificateNotReady
                expr: certmanager_certificate_ready_status{condition!="True"} == 1
                for: 30m
                labels:
                  severity: critical
                  component: platform
                annotations:
                  summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready"
                  description: "cert-manager has reported this certificate not ready for 30 minutes. Renewal is failing; expiry follows if nothing changes."

              # 14 days, NOT 30. cert-manager renews Let's Encrypt certificates
              # at roughly 30 days before expiry, so a 30-day threshold fires on
              # every healthy certificate in the cluster -- the nearest one sat
              # at 29.7 days on 2026-08-16. 14 days means renewal has been
              # failing for a fortnight, which is a fact rather than a schedule.
              #
              # This is the backstop for the failure mode that leaves Ready
              # true. KubexaCertificateNotReady above is the primary.
              - alert: KubexaCertificateExpiringSoon
                expr: |
                  (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 14
                for: 1h
                labels:
                  severity: warning
                  component: platform
                annotations:
                  summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in under 14 days"
                  description: "{{ $value | printf \"%.1f\" }} days left. cert-manager should have renewed this around 30 days out, so renewal is not working."

          - name: apiserver
            rules:
              # increase() over 15m with for: 0m, NOT rate() with a matching
              # for:. A `for:` at least as long as the lookback window can never
              # be satisfied by a burst shorter than the window -- the condition
              # goes true and false again before the timer completes, and the
              # rule looks correct while never firing. The patience belongs in
              # the window. This is the pattern for every counter rule below.
              - alert: KubexaApiserverErrors
                expr: |
                  sum by (route) (increase(kubexa_apiserver_http_requests_total{status=~"5.."}[15m])) > 0
                for: 0m
                labels:
                  severity: warning
                  component: apiserver
                annotations:
                  summary: "apiserver is returning 5xx on {{ $labels.route }}"
                  description: "{{ $value | humanize }} server errors in the last 15 minutes on {{ $labels.route }}."

          - name: gateway
            rules:
              # The gauge is a state set: three series, exactly one of which is
              # 1. Reading the connected one directly is clearer than summing
              # the others and says the same thing.
              - alert: KubexaGatewayNatsDisconnected
                expr: kubexa_gateway_nats_connection_state{state="connected"} == 0
                for: 2m
                labels:
                  severity: critical
                  component: gateway
                annotations:
                  summary: "Gateway is not connected to NATS"
                  description: "The agentserver has been disconnected from NATS for 2 minutes. Telemetry it accepts cannot be published, so it buffers until the buffer gives out."

              - alert: KubexaGatewayBufferDropping
                expr: increase(kubexa_gateway_buffer_dropped_total[30m]) > 0
                for: 0m
                labels:
                  severity: warning
                  component: gateway
                annotations:
                  summary: "Gateway buffer dropped telemetry"
                  description: "{{ $value | humanize }} items dropped from the gateway buffer in the last 30 minutes. They were accepted from an agent and then discarded; nothing retries them."

              # Separate from the buffer rule on purpose: the buffer overflowing
              # and a single message being too large to carry call for different
              # responses. Same reasoning that made LokiDiscardingLines group by
              # reason rather than sum into one number that says only "something
              # is being dropped".
              - alert: KubexaGatewayOversizeDropping
                expr: increase(kubexa_gateway_oversize_dropped_total[30m]) > 0
                for: 0m
                labels:
                  severity: warning
                  component: gateway
                annotations:
                  summary: "Gateway dropped oversize telemetry"
                  description: "{{ $value | humanize }} items exceeded the gateway's size limit in the last 30 minutes and were discarded rather than truncated."

              # This series does not exist yet: a labelled counter is not
              # exported until its first increment. The rule therefore matches
              # nothing today and costs nothing, and starts working on the day
              # the first handshake is rejected -- the only day it matters.
              #
              # Because there is no series, a typo here CANNOT be caught by
              # querying VictoriaMetrics. The name was checked against
              # internal/agentserver/metrics/metrics.go instead.
              - alert: KubexaHandshakeRejections
                expr: |
                  sum by (reason) (increase(kubexa_gateway_handshake_rejected_total[30m])) > 0
                for: 0m
                labels:
                  severity: warning
                  component: gateway
                annotations:
                  summary: "Agent handshakes are being rejected ({{ $labels.reason }})"
                  description: "{{ $value | humanize }} handshakes rejected for reason {{ $labels.reason }} in the last 30 minutes. Those agents are not connected and are sending nothing at all."

          # Both counters are agent-reported figures relayed through the
          # agentserver's heartbeat handler, so they describe loss that happened
          # AT the agent, before anything reached the platform. tenant_id and
          # cluster_id survive that relay and are the only way to say whose.
          - name: agent
            rules:
              - alert: KubexaAgentDropsTooOld
                expr: |
                  sum by (tenant_id, cluster_id) (increase(kubexa_gateway_agent_dropped_too_old_total[30m])) > 0
                for: 0m
                labels:
                  severity: warning
                  component: agent
                annotations:
                  summary: "Agent on cluster {{ $labels.cluster_id }} is dropping records as too old"
                  description: "{{ $value | humanize }} records dropped past max_sample_age in the last 30 minutes. Either the agent is running behind or the cluster's clock is off; both lose data that is not retried."

              # Separate from too_old, because the answers differ: this one is
              # the agent's own per-stream ingest limit, and raising it is a
              # config decision rather than a repair.
              - alert: KubexaAgentRateLimited
                expr: |
                  sum by (tenant_id, cluster_id) (increase(kubexa_gateway_agent_dropped_rate_limited_total[30m])) > 0
                for: 0m
                labels:
                  severity: warning
                  component: agent
                annotations:
                  summary: "Agent on cluster {{ $labels.cluster_id }} is hitting its per-stream rate limit"
                  description: "{{ $value | humanize }} log lines dropped against the agent's per-stream limit in the last 30 minutes. Those lines are gone; raising the limit does not recover them."

          - name: consumer
            rules:
              # Every rule in this group groups by every identity label its
              # source counter carries, not just the labels needed to describe
              # the failure. An aggregate that hides which tenant is affected
              # cannot produce a second notification when a second tenant starts
              # failing: only state changes notify, so while the alert is
              # already firing for one tenant, a second tenant's drops just move
              # an already-nonzero sum and nothing changes state. Dropping an
              # identity label at aggregation time silently drops the tenants
              # behind it from ever being told apart.
              #
              # class is on the error counter and not on the drop counter, and
              # the grouping follows the data rather than being made symmetric:
              # a permanent failure and a retryable one are different news.
              - alert: KubexaConsumerWriteErrors
                expr: |
                  sum by (destination, class, reason, tenant_namespace) (increase(kubexa_consumer_write_errors_total[30m])) > 0
                for: 0m
                labels:
                  severity: warning
                  component: consumer
                annotations:
                  summary: "Consumer writes to {{ $labels.destination }} are failing ({{ $labels.class }}/{{ $labels.reason }})"
                  description: "{{ $value | humanize }} failed write attempts in the last 30 minutes, namespace {{ $labels.tenant_namespace }}. A permanent class is not retried."

              # This rule has a live precedent. In the 24 hours before it was
              # written, 55 records were discarded to Loki as bad_request with
              # nobody told -- found only by querying the instance by hand while
              # designing this catalog. That is the condition it exists for.
              #
              # Grouped by tenant_id/cluster_id as well as destination/reason --
              # see the group comment above. This counter carries cluster_id;
              # kubexa_consumer_write_errors_total above does not, so inventing
              # one there would be wrong.
              - alert: KubexaConsumerDropping
                expr: |
                  sum by (destination, reason, tenant_id, cluster_id) (increase(kubexa_consumer_messages_dropped_total[30m])) > 0
                for: 0m
                labels:
                  severity: warning
                  component: consumer
                annotations:
                  summary: "Consumer is discarding messages to {{ $labels.destination }} ({{ $labels.reason }})"
                  description: "{{ $value | humanize }} telemetry messages abandoned without being written in the last 30 minutes, cluster {{ $labels.cluster_id }}. They are not retried and cannot be recovered."

              # No series until the first cooldown, like the handshake rule --
              # name verified against kubexa-consumer/internal/metrics rather
              # than against the instance. The label is tenant_namespace and not
              # namespace, deliberately, so VictoriaMetrics does not rename it.
              #
              # max_over_time(...[30m]) == 1 with for: 0m, NOT the gauge read
              # directly with for: 5m. That would need the gauge to read 1 on
              # five consecutive 60s evaluations, and it cannot: in
              # kubexa-consumer, defaultCooldownMax caps a cooldown window at
              # 60s (internal/config/config.go), and expireCooldownsLocked
              # writes the gauge back to false the instant a window runs out
              # (internal/writer/buffer/batcher.go), with a new window only
              # opening on the next batch that hits a rate limit. Under genuine
              # sustained throttling the gauge cycles 1 -> 0 -> 1 at least once
              # a minute, so any scrape landing in a gap resets the for timer --
              # the same defect class this whole catalog exists to avoid, in
              # gauge form. max_over_time asks the honest question instead: was
              # this destination in cooldown at any point in the last 30
              # minutes, matching the window every counter rule in this file
              # uses. The available labels are exactly destination and
              # tenant_namespace; template only those.
              - alert: KubexaConsumerBackpressure
                expr: max_over_time(kubexa_consumer_cooldown_active[30m]) == 1
                for: 0m
                labels:
                  severity: warning
                  component: consumer
                annotations:
                  summary: "Consumer is refusing writes to {{ $labels.destination }}"
                  description: "A rate limit put {{ $labels.destination }} into cooldown for namespace {{ $labels.tenant_namespace }} at some point in the last 30 minutes."

          - name: loki
            rules:
              - alert: LokiRetentionStalled
                # for: 0m deliberately. The condition already contains 24 hours
                # of patience; waiting longer only delays a message about
                # something that has been broken for a day.
                #
                # The gauge is registered and scraped at 0 before the
                # compactor's first successful run -- present, not absent, so
                # this is not the KubexaBackupStale absence pattern. Verified
                # live: every fresh or restarted pod reads 0 for ~10-15m (its
                # own compaction_interval) before the first apply_retention
                # succeeds, and `time() - 0` is enormous -- so the un-guarded
                # expr fired on every install and every Loki restart, not just
                # a genuinely stalled compactor. The zero case is guarded on
                # the process's own uptime instead of the 24h it hasn't
                # earned yet; a compactor that never once succeeds still
                # fires once it has had a full day to.
                expr: |
                  (
                    loki_compactor_apply_retention_last_successful_run_timestamp_seconds > 0
                    and
                    time() - loki_compactor_apply_retention_last_successful_run_timestamp_seconds > 86400
                  )
                  or
                  (
                    loki_compactor_apply_retention_last_successful_run_timestamp_seconds == 0
                    and
                    time() - process_start_time_seconds{namespace="kubexa", app_kubernetes_io_name="kubexa-loki"} > 86400
                  )
                for: 0m
                labels:
                  severity: warning
                  component: loki
                annotations:
                  summary: "Loki retention has not run for 24h"
                  description: "The compactor last applied retention {{ $value | humanizeDuration }} ago. Storage grows without bound while this is true."

              - alert: LokiDiscardingLines
                # Grouped by reason, and that grouping is the point: rate_limited
                # and too_far_behind call for different responses, so each
                # discard reason gets its own alert with its own lifecycle rather
                # than being summed into one number that says only "something is
                # being dropped".
                expr: |
                  sum by (reason) (rate(loki_discarded_samples_total[5m])) > 0
                for: 5m
                labels:
                  severity: warning
                  component: loki
                annotations:
                  summary: "Loki is discarding log lines ({{ $labels.reason }})"
                  description: "Discarding {{ $value | humanize }} entries/s for reason {{ $labels.reason }}. Those lines are gone; they are not retried."

          # Off by default. `backup.enabled` is false in the umbrella chart's
          # values.yaml, and a cluster that has never turned backups on will page
          # on this rule from the moment vmalert starts, for the same reason it
          # pages on a genuinely broken CronJob: the metric doesn't exist in
          # either case, and MetricsQL cannot tell "never enabled" from
          # "enabled and silently failing since day one" apart. That is a
          # correct answer for a cluster that IS supposed to be backed up and a
          # false alarm for one that isn't -- see
          # ../kubexa/README-restore.md#alert-scoping for how an operator running
          # without backups keeps this rule from firing on their install.
          - name: backup
            rules:
              # time() - max(metric) alone goes silent -- not merely inactive,
              # UNEVALUATABLE -- the moment the metric has never been pushed:
              # max() over zero series returns no series at all, so the whole
              # expression matches nothing and the rule can never go firing. That
              # is exactly the failure this alert exists to catch: a CronJob
              # deleted, an image that cannot be pulled, or a pod that never
              # started produce no failure event AND no metric, ever.
              #
              # `or vector(0)` is the fix, the same role vector(1) plays for
              # KubexaAlertPipelineHeartbeat above: it folds in an always-present
              # fallback series so the left side of `-` is never empty. With the
              # metric absent, max(...) contributes no series and `or` falls
              # through to vector(0), so the expression becomes time() - 0 --
              # enormous, and past the threshold on the very first evaluation.
              # With the metric present, max(...) already has a series and `or`
              # never reaches its right-hand side, so a healthy install is
              # unaffected.
              #
              # That absence fallback is necessary but not sufficient. The
              # metric is a once-a-day gauge, not a continuously-scraped one,
              # and an instant query answers a raw selector from its own
              # 5-minute lookbehind window by default. Without a lookbehind of
              # its own, the series drops out of that window five minutes after
              # a SUCCESSFUL push, `max(...)` contributes no series again, and
              # `or` falls through to vector(0) exactly as if the backup had
              # never run -- so the rule would go pending 5 minutes after every
              # good backup and fire 15 minutes later, unable to distinguish
              # success from failure at all. `last_over_time(...[48h])` gives
              # the selector its own 48h lookbehind (wider than the 26h
              # threshold, so a genuinely stale-but-present metric still
              # reports its real age) and only the true absence case falls
              # through to vector(0).
              - alert: KubexaBackupStale
                # The threshold comes from the metric, not from this file: the
                # runner publishes kubexa_backup_max_age_seconds from its own
                # schedule, so changing the schedule on the settings screen
                # re-aims this rule with no helm upgrade.
                #
                # The lookbehind is 45d, not 48h. A weekly data backup publishes
                # its success once every seven days, so a 48h window -- which is
                # what the nightly-only version of this rule used -- drops the
                # sample and fires on a scope that is working perfectly.
                #
                # 45d rather than 35d, and the two numbers are not independent:
                # the runner publishes 1.2 x the interval as max_age, so a
                # monthly data scope publishes 36d. With a 35d lookbehind the
                # samples fall out of the window BEFORE the age crosses the
                # threshold, and the rule can never be true -- red never, for the
                # scope holding 99.8% of the data. If MaxAge in
                # internal/backup/schedule.go grows a longer interval, this
                # window grows with it.
                expr: |
                  (
                    time() - max by (scope) (last_over_time(kubexa_backup_last_success_timestamp_seconds[45d]))
                  )
                  > on (scope)
                  max by (scope) (last_over_time(kubexa_backup_max_age_seconds[45d]))
                  and on (scope)
                  max by (scope) (last_over_time(kubexa_backup_enabled[45d])) == 1
                for: 15m
                labels:
                  severity: critical
                  component: backup
                annotations:
                  summary: "Backup scope {{ $labels.scope }} is stale"
                  description: "Backup scope {{ $labels.scope }} last succeeded {{ $value | humanizeDuration }} ago, past the threshold its own schedule allows (or has never succeeded at all, if that duration looks like decades). The job may not even be attempting right now -- check whether KubexaBackupFailing or KubexaBackupNotRunning is also firing for this scope before assuming a stale success is the whole story."

              - alert: KubexaBackupFailing
                # The pod is running and the backup is not working: attempt is
                # fresh while success is not. Separate from Stale because the
                # operator response differs -- this one has a pod log to read
                # right now.
                expr: |
                  (
                    time() - max by (scope) (last_over_time(kubexa_backup_last_attempt_timestamp_seconds[45d])) < 26 * 3600
                  )
                  and on (scope)
                  (
                    time() - max by (scope) (last_over_time(kubexa_backup_last_success_timestamp_seconds[45d])) > 26 * 3600
                  )
                  and on (scope)
                  max by (scope) (last_over_time(kubexa_backup_enabled[45d])) == 1
                for: 15m
                labels:
                  severity: critical
                  component: backup
                annotations:
                  summary: "Backup scope {{ $labels.scope }} is running but not succeeding"
                  description: "Backup scope {{ $labels.scope }} has a fresh attempt within the last 26 hours but no success in that same window: the pod is running and the backup is not working. Unlike KubexaBackupStale, there is a pod log to read right now -- this is failing tonight, not merely aging."

              # KubexaBackupNotRunning is REMOVED on this install, and the rule
              # itself is not wrong -- the install is. Its expression is
              #
              #   time() - (max(last_over_time(kubexa_backup_last_attempt_timestamp_seconds[45d])) or vector(0)) > 26 * 3600
              #
              # and it deliberately ignores kubexa_backup_enabled so that
              # switching backups off cannot switch the alarm off. That is the
              # right stance for an install where backup is MEANT to run. Here
              # backup.enabled is false on purpose -- the backup image is private
              # on GHCR and there is no object store account -- so the metric does
              # not exist at all, `or vector(0)` resolves to 0, and
              # time() - 0 > 26h is true forever. The result is a CRITICAL that is
              # permanently firing, that nobody can act on, and that teaches
              # whoever reads the alert screen to discount criticals. Same shape as
              # the absence-fallback trap in ../vmalert/README.md: a fallback of 0
              # makes "never" indistinguishable from "very long ago".
              #
              # KubexaBackupStale and KubexaBackupFailing above are left in place
              # deliberately: both are gated on
              # `kubexa_backup_enabled == 1`, so with no backup job they evaluate
              # against nothing and stay silent -- and they start working the
              # moment backup is turned on, with no edit here.
              #
              # PUT THIS BACK the same day backup starts running. Uncommenting the
              # block below is the whole change; it is quoted verbatim from the
              # version that ran before 2026-09-26.
              # - alert: KubexaBackupNotRunning
              #   # Deliberately NOT gated on enabled: this is the always-present
              #   # signal. Turning backups off silences the two rules above; it
              #   # must not silence the one that says the job itself stopped
              #   # waking up.
              #   #
              #   # A disabled run still stamps last_attempt (see
              #   # internal/backup/metrics.go), so switching backups off on the
              #   # settings screen does not make this fire -- only a CronJob that
              #   # never wakes does.
              #   #
              #   # `or vector(0)` makes a never-seen metric fire rather than
              #   # evaluate to nothing -- but only in combination with the
              #   # lookbehind: with the default 5m window, a once-a-night sample
              #   # falls out and this fires on a healthy install.
              #   expr: |
              #     time() - (max(last_over_time(kubexa_backup_last_attempt_timestamp_seconds[45d])) or vector(0)) > 26 * 3600
              #   for: 15m
              #   labels:
              #     severity: critical
              #     component: backup
              #   annotations:
              #     summary: "The backup job has not run at all in over 26 hours"
              #     description: "No backup scope has attempted a run at all in over 26 hours ({{ $value | humanizeDuration }} since the last attempt, or effectively forever if that looks like decades). The CronJob itself is not waking up -- deleted, unschedulable, or an image that cannot be pulled -- so there is no pod and no log to read. This rule deliberately ignores kubexa_backup_enabled and keeps firing even with every scope switched off; it is not a false alarm from backups being turned off on purpose."

              # # This chart bundles an Alertmanager and would deploy one by default. Turning
              # # it off is a decision, not a saving: alerts go straight from vmalert to the
              # # apiserver, so there is no grouping, inhibition or silencing anywhere in this
              # # path. An Alertmanager is a second stateful service to operate, for features
              # # nobody has asked for yet.
  alertmanager:
    enabled: false

# ─── components ─────────────────────────────────────────────────────────────

apiserver:
  enabled: true
  # Everything under here is the kubexa-apiserver chart's own values surface;
  # see its README. Only the wiring this chart is responsible for is set.
  config:
    # The address an operator points a kubexa-agent at -- served to the app so
    # its "connect a cluster" panel can print a helm command that works on this
    # install. Normally the same host as agentserver.ingress.host below; this
    # chart cannot copy it for you, because Helm does not template values.yaml,
    # so templates/NOTES.txt compares the two and warns when they disagree.
    #
    # Empty is a real state, not an oversight: the app shows a placeholder
    # rather than a command. Leave it empty until the agentserver is actually
    # reachable from outside, and never set it to gateway.kubexa.dev -- that is
    # the hosted platform's gateway, and an agent pointed there never reaches
    # this install.
    #
    # Needs kubexa-apiserver chart >= 0.4.38 to RENDER, and >= 0.4.39 to have
    # any effect. Two different failures, both silent:
    #
    # Below 0.4.38 the subchart has no `agent` block, so setting this renders
    # NOTHING -- no error, and the NOTES warning below is satisfied and quiet.
    # At exactly 0.4.38 the block renders but appVersion is 0.5.31, whose
    # binary has no GET /api/v1/agent-defaults route: it boots fine (the config
    # loader is non-strict and ignores the block) and answers 404, so the app
    # still shows the placeholder. 0.4.39 is the first chart whose image
    # serves the route.
    agent:
      gatewayHost: ""
    upstreams:
      redis:
        addrs:
          - kubexa-valkey:6379
      postgres:
        app:
          host: kubexa-postgres
          database: kubexa_app
          user: kubexa_app
          # The bundled Postgres is a ClusterIP Service with no certificate,
          # so `require` -- the apiserver chart's own default, and the right
          # default for a database across a network -- fails the connection
          # outright. Turn postgres.enabled off and this must go back to
          # require; templates/guards.yaml refuses the combination that
          # leaves it here.
          sslMode: disable
        users:
          host: kubexa-postgres
          database: kubexa_users
          user: kubexa_users
          sslMode: disable
      victoriametrics:
        url: http://kubexa-victoriametrics:8428
      loki:
        url: http://kubexa-loki:3100
        # A copy of loki.limits_config.retention_period above, kept in sync by
        # hand and deliberately: the apiserver shows the retention window in
        # the log explorer, and reading Loki's /config at boot would make a
        # store outage into a startup failure. Change one, change both.
        retentionPeriod: 720h
      agentserver:
        # -internal, not the plain Service: an earlier task moved the admin
        # port onto a second, always-ClusterIP Service so that a LoadBalancer
        # or NodePort type on the agent-facing one cannot publish it.
        # kubexa-agentserver:50052 renders and installs cleanly and then never
        # connects, because that Service does not carry port 50052 at all.
        #
        # This literal only stays correct because agentserver.fullnameOverride
        # below is pinned to "kubexa-agentserver" rather than left to derive
        # from the release name -- templates/NOTES.txt recomputes the expected
        # address from that same value and warns if the two ever drift apart,
        # rather than comparing this literal against a second copy of itself.
        controlAddr: kubexa-agentserver-internal:50052
    # Same-origin removes CORS from the BROWSER's path, but not from the
    # server's: internal/config/apiserver.go's ApplyAPIServerDefaults turns an
    # empty list into ["*"], so leaving this unset serves
    # Access-Control-Allow-Origin: * to every caller. Set it to the shared
    # origin -- scheme included -- e.g. https://kubexa.example.com.
    corsAllowedOrigins: []
    # Off by default: an install where the operator sets nothing stays inert,
    # the same as before this chart could turn web push on at all. Set
    # enabled: true and fill in vapidPublicKey/subject together with
    # secrets.webPushVapidPrivateKey below -- the public key without the
    # private one (or vice versa) leaves the feature half-wired.
    notifications:
      webPush:
        enabled: false
        vapidPublicKey: ""
        subject: ""
    platform:
      # Not secret. Set only at first install, before any platform_settings
      # row is sealed with secrets.platformKeySecret above -- changing it
      # afterwards fails every settings read with platform.foreign_key_id,
      # since rotation is not implemented. Refused outright with
      # backup.enabled=true: the backup job always seals/opens under
      # "default" (cmd/backup has no config path for the id).
      settingsKeyId: ""
  ingress:
    enabled: false
    className: nginx
    # The SAME host as app.ingress.host. nginx merges Ingress objects that
    # share a host and resolves by longest prefix, so this path wins over the
    # app's "/" without either chart knowing the other's Service name.
    host: ""
    path: /api/v1
    pathType: Prefix
    tls:
      # Deliberately off: app.ingress owns TLS for the shared host.
      enabled: false
      secretName: ""
  secrets:
    # By reference, not by value: the bundled Valkey generates its password
    # into its own Secret at render time, and a generated value cannot travel
    # through values into a sibling chart.
    redisPasswordSecret:
      name: kubexa-valkey-auth
      key: password
    # By reference, not by value: templates/postgres-secret.yaml generates
    # these at render time and a generated value cannot travel through values
    # into a sibling chart. Requires kubexa-apiserver >= 0.4.23.
    postgresAppPasswordSecret:
      name: kubexa-postgres-auth
      key: app-password
    postgresUsersPasswordSecret:
      name: kubexa-postgres-auth
      key: users-password
    # By reference, like the two above, but unlike them nothing in this
    # chart GENERATES this Secret -- the platform settings key is a
    # 32-byte AES-256 key (base64), and unlike a database password there is
    # no safe default to invent at install time: whoever creates it is
    # trusting it with every secret setting (mail credentials, S3 keys) the
    # platform settings screen will ever seal. Empty by default, same as
    # backup.encryption.existingSecret -- the operator must create it (or
    # leave this empty, in which case secret settings stay refused rather
    # than stored in plaintext).
    #
    # Consumed by BOTH the apiserver Deployment (apiserver chart >= 0.4.55,
    # by reference, never optional) and templates/backup-cronjob.yaml: the
    # process that seals a row and the job that unseals it read one Secret.
    # apiserver.config.platform.settingsKeyId (rendered as
    # platform.settings_key_id) tags every row this key seals; it defaults
    # to "default" and is a first-install-only setting -- changing it after
    # any row has been sealed fails every settings read with
    # platform.foreign_key_id, since rotation is not implemented. The
    # backup job never reads this id and always seals/opens under
    # "default", so it is refused outright when backup.enabled is true.
    platformKeySecret:
      name: ""
      key: platform-settings-key
    # Never rendered into config, only this Secret key -- see
    # config.notifications.webPush above. Empty by default, same as every
    # other credential in this file; it never appears in this repo by value.
    webPushVapidPrivateKey: ""

# ─── web UI ─────────────────────────────────────────────────────────────────
#
# The SAME hostname the apiserver is exposed on, above. That is not a
# convenience: the image is built once against the relative base /api/v1, and
# the service worker's rules for /api (navigateFallbackDenylist, NetworkOnly in
# vite.config.ts) are path-based. Split the two across hostnames and the app
# starts serving index.html for API navigations, caching API responses, and
# making cross-origin requests that need CORS.
app:
  enabled: true
  ingress:
    enabled: false
    className: nginx
    # Set this and apiserver.ingress.host to the same value.
    host: ""
    path: /
    pathType: Prefix
    tls:
      # The app Ingress owns TLS for the shared host; the apiserver's is left
      # off above. Two Ingress objects declaring TLS for one host make
      # cert-manager open two Certificates against a single Secret.
      enabled: false
      secretName: ""

agentserver:
  enabled: true
  # A static name, not <release>-agentserver: the same reason
  # nats.fullnameOverride and valkey.serviceName are both pinned above.
  # apiserver.config.upstreams.agentserver.controlAddr below is a literal
  # string in this file (Helm does not template values.yaml), computed as
  # "<this name>-internal:50052" -- so it can only stay correct across
  # release names if this chart's own Service name is also a
  # release-independent literal. Without this, `helm install prod ...` would
  # render kubexa-agentserver's Services as "prod-agentserver[-internal]"
  # while controlAddr still said "kubexa-agentserver-internal:50052", and the
  # apiserver's gateway client would dial a Service that doesn't exist --
  # silently, since that dependency's readiness check is soft and the
  # install would stay Ready throughout.
  fullnameOverride: kubexa-agentserver
  # Everything under here is the kubexa-agentserver chart's own values
  # surface; see its README. Only the wiring this chart is responsible for is
  # set. replicas is left untouched -- the chart's own default (1) is already
  # correct and values.schema.json pins it there; the apiserver reaches this
  # process through a single controlAddr, so a second replica would serve
  # stale tokens and stale tenant ingest limits with no error anywhere.
  config:
    nats:
      url: nats://kubexa-nats:4222
      username: kubexa
    # Same Redis/Valkey the apiserver above points at, not an independent
    # choice: internal/agentserver/runner.go's demand-driven watch
    # reconciler shares its leases with the apiserver through this instance,
    # so the two config surfaces have to agree, not just each be individually
    # valid. templates/guards.yaml fails the render if they're set apart.
    redis:
      addrs:
        - kubexa-valkey:6379
  secrets:
    # Both by reference, not by value -- the same reason apiserver's
    # redisPasswordSecret above is: a generated password cannot travel into a
    # sibling chart's values, Helm coalesces values before rendering, so it
    # moves by naming the Secret the bundled chart generates it into.
    natsPasswordSecret:
      name: kubexa-nats-auth
      key: password
    redisPasswordSecret:
      name: kubexa-valkey-auth
      key: password

consumer:
  enabled: true
  # A static name, not <release>-consumer -- same reason as agentserver's
  # fullnameOverride above. Nothing in this chart addresses the consumer's
  # Service by name today (it has no inbound caller at all -- see its own
  # README), but pinning it now keeps that true by construction instead of
  # by accident, and keeps the naming scheme uniform across all four "static
  # per component" Service names (kubexa-valkey, kubexa-nats,
  # kubexa-agentserver, kubexa-consumer).
  fullnameOverride: kubexa-consumer
  # Everything under here is the kubexa-consumer chart's own values surface;
  # see its README. Only the wiring this chart is responsible for is set.
  config:
    nats:
      url: nats://kubexa-nats:4222
      username: kubexa
    victoriaMetrics:
      url: http://kubexa-victoriametrics:8428
    # The telemetry writer.
    postgres:
      host: kubexa-postgres
      port: 5432
      username: kubexa_app
      database: kubexa_app
      sslMode: disable
    # The cluster registry, NOT an optional extra: it resolves each cluster's
    # namespace into the X-Scope-OrgID every Loki push carries, and the
    # consumer's Validate() refuses a non-empty loki.url with no usersDb.
    usersDb:
      host: kubexa-postgres
      port: 5432
      username: kubexa_users
      database: kubexa_users
      sslMode: disable
    loki:
      url: http://kubexa-loki:3100
  secrets:
    natsPasswordSecret:
      name: kubexa-nats-auth
      key: password
    postgresPasswordSecret:
      name: kubexa-postgres-auth
      key: app-password
    usersDbPasswordSecret:
      name: kubexa-postgres-auth
      key: users-password

# ─── backup ──────────────────────────────────────────────────────────────────
#
# Nightly logical backup of the app and users databases. It reuses
# apiserver.config.upstreams.postgres and the apiserver password Secret
# references: a backup with its own connection settings would keep dumping the
# old database after the apiserver moved, and report success every night.
backup:
  enabled: false
  schedule: "0 2 * * *"
  # 0.2.0 is the first image that splits the run into a system scope and a data
  # scope and reads enabled/destination/retention/schedule from platform_settings
  # rather than from this chart. 0.1.0 still runs against a 0.5.19 schema -- it
  # simply backs up one undivided kubexa_app, all 6.7 GB of it, every night.
  image: ghcr.io/kubexa/kubexa-backup:0.2.0
  imagePullPolicy: IfNotPresent
  workDir:
    sizeLimit: 10Gi
  # The SYSTEM scope: everything except the tables data.tables below carves
  # out. Left as one number, unlike data.keep, because nothing has asked to
  # retain it on a different schedule from "every night" -- renaming or
  # splitting this key would break installs that already set it.
  retention:
    keep: 14
  # The data scope covers the tables that grow without bound. It is separate
  # from the nightly system backup because the two have very different sizes:
  # the system scope is tens of megabytes, this one is gigabytes.
  #
  # These are SEED values. Once the install has booted they live in
  # platform_settings and are edited from the platform settings screen;
  # changing them here afterwards has no effect on an install that already has
  # rows.
  data:
    schedule: weekly   # off | weekly | monthly | nightly
    keep: 4
    tables: "kubexa_state_events*"
  encryption:
    keyId: default
    existingSecret:
      name: ""
      key: encryption-key
  destination:
    driver: s3
    s3:
      endpoint: ""
      region: ""
      bucket: ""
      prefix: kubexa
      useSSL: true
      forcePathStyle: false
      existingSecret:
        name: ""
        accessKeyIdKey: access-key-id
        secretAccessKeyKey: secret-access-key
    filesystem:
      existingClaim: ""
      path: /backups
      prefix: kubexa
  # Same default as apiserver.config.upstreams.victoriametrics.url (line ~402)
  # and consumer.config.victoriaMetrics.url (line ~559) -- keep all three in
  # step. Unlike those two, this one is guarded (templates/guards.yaml): an
  # empty url here does not stop the backup from running, it stops the backup
  # from ever being OBSERVABLE, which is the trap I3 closed.
  victoriaMetrics:
    url: http://kubexa-victoriametrics:8428
  resources:
    limits: { cpu: 1, memory: 1Gi }
    requests: { cpu: 100m, memory: 128Mi }
