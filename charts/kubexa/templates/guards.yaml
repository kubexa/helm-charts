{{- /*
Combinations that render cleanly and then fail in the cluster in ways nothing
points at, checked here because they depend on more than one subchart's
values at once -- no single chart's own schema or templates can see both
sides.
*/ -}}
{{- if and (not .Values.valkey.enabled) .Values.apiserver.enabled }}
{{- $valkeyAuthSecret := printf "%s-auth" (include "kubexa.valkeyFullname" .) }}
{{- if eq .Values.apiserver.secrets.redisPasswordSecret.name $valkeyAuthSecret }}
{{- fail (printf "valkey.enabled=false but apiserver.secrets.redisPasswordSecret.name is still %q, the Secret templates/valkey-secret.yaml would have generated for the bundled Valkey. With valkey disabled that Secret is never rendered, and kubexa-apiserver's KUBEXA_APISERVER_REDIS_PASSWORD secretKeyRef is deliberately non-optional, so the apiserver pod fails with CreateContainerConfigError: secret %q not found. Pick one: (1) set apiserver.secrets.redisPasswordSecret.name to \"\" and set apiserver.secrets.redisPassword to your Redis instance's password (or leave both empty if it needs none), or (2) point apiserver.secrets.redisPasswordSecret.name (and .key) at a Secret you created yourself." $valkeyAuthSecret $valkeyAuthSecret) }}
{{- end }}
{{- end }}

{{- /*
NATS disabled, but the agentserver and/or the consumer are still pointed at
the bundled NATS's Service name. With nats.enabled=false that Service (and
the Secret templates/nats-secret.yaml would have generated) are never
rendered, so the pointed-at name resolves to nothing: the agentserver
buffers every batch to its spill volume and retries forever (maxReconnects
defaults to -1), and the consumer's /readyz never turns ready because its
`nats` component check never reports ok -- neither failure names NATS as the
cause anywhere a first-time reader would look.
*/ -}}
{{- if not .Values.nats.enabled }}
{{- $bundledNatsURL := "nats://kubexa-nats:4222" }}
{{- if and .Values.agentserver.enabled (eq .Values.agentserver.config.nats.url $bundledNatsURL) }}
{{- fail (printf "nats.enabled=false but agentserver.config.nats.url is still %q, the bundled NATS chart's Service name. That Service is never rendered with nats disabled, so the agentserver dials a name that resolves to nothing. Point agentserver.config.nats.url at your own NATS instance." $bundledNatsURL) }}
{{- end }}
{{- if and .Values.consumer.enabled (eq .Values.consumer.config.nats.url $bundledNatsURL) }}
{{- fail (printf "nats.enabled=false but consumer.config.nats.url is still %q, the bundled NATS chart's Service name. That Service is never rendered with nats disabled, so the consumer dials a name that resolves to nothing and /readyz never turns ready. Point consumer.config.nats.url at your own NATS instance." $bundledNatsURL) }}
{{- end }}
{{- end }}

{{- /*
The agentserver and the apiserver pointed at different Redis/Valkey
instances. internal/agentserver/runner.go:183 starts the demand-driven watch
reconciler against agentserver.config.redis -- its leases are shared state
with the apiserver's own upstreams.redis, not independent config surfaces --
so an agentserver pointed elsewhere starts no reconciler and says nothing
beyond a warn log. An EMPTY agentserver.config.redis.addrs is deliberately
not guarded here: that is the documented "reconciler stays unstarted"
degraded state (see the agentserver chart's own values.yaml), not a
mismatch.
*/ -}}
{{- if and .Values.agentserver.enabled .Values.apiserver.enabled .Values.agentserver.config.redis.addrs }}
{{- if ne (toJson .Values.agentserver.config.redis.addrs) (toJson .Values.apiserver.config.upstreams.redis.addrs) }}
{{- fail (printf "agentserver.config.redis.addrs (%s) differs from apiserver.config.upstreams.redis.addrs (%s): internal/agentserver/runner.go:183's demand-driven watch reconciler shares its leases with the apiserver through this same Redis/Valkey, so an agentserver pointed at a different instance starts a reconciler whose leases nothing else ever sees, with only a warn log naming it. Point both at the same Redis/Valkey instance." (toJson .Values.agentserver.config.redis.addrs) (toJson .Values.apiserver.config.upstreams.redis.addrs)) }}
{{- end }}
{{- end }}

{{- /*
The agentserver's JetStream byte cap at or above the bundled NATS PVC's size.
Both numbers are starting values (see the comments on each in values.yaml),
but whichever direction they drift, having them cross is silent: JetStream
enforces config.nats.jetstream.maxBytes as a soft cap on the stream and
starts refusing publishes once it is reached (internal/agentserver/nats
buffers instead, to the OTHER volume, the spill disk) while the filesystem
underneath store_dir still has room, or the PVC fills first and NATS starts
returning "no space left on device" while it still believes it has budget --
either way nothing at the chart level says the two were ever meant to relate.
Only checked when nats's own JetStream file store is actually what backs the
stream (fileStore/PVC enabled); memory-only or externally-sized deployments
are not this guard's concern.
*/ -}}
{{- if and .Values.nats.enabled .Values.agentserver.enabled .Values.nats.config.jetstream.enabled .Values.nats.config.jetstream.fileStore.enabled }}
{{- $effectiveSize := "" }}
{{- if .Values.nats.config.jetstream.fileStore.maxSize }}
{{- $effectiveSize = .Values.nats.config.jetstream.fileStore.maxSize }}
{{- else if .Values.nats.config.jetstream.fileStore.pvc.enabled }}
{{- $effectiveSize = .Values.nats.config.jetstream.fileStore.pvc.size }}
{{- end }}
{{- if $effectiveSize }}
{{- $pvcBytes := include "kubexa.bytesFromQuantity" $effectiveSize | float64 }}
{{- $maxBytes := .Values.agentserver.config.nats.jetstream.maxBytes | float64 }}
{{- if ge $maxBytes $pvcBytes }}
{{- fail (printf "agentserver.config.nats.jetstream.maxBytes (%v bytes) is at or above the bundled NATS's file store size (%s = %v bytes): both are starting values, not measurements (see the comments on each in values.yaml), but with the stream's byte cap at or past the volume that stores it, JetStream can fill the PVC before it ever enforces its own limit -- or the reverse, if the volume is smaller, the disk fills and NATS starts refusing writes with nothing calling out that the two numbers were ever supposed to relate. Lower agentserver.config.nats.jetstream.maxBytes, raise nats.config.jetstream.fileStore.pvc.size (or .maxSize), or -- once the pipeline is live -- read the stream's real growth with `nats stream info` and set both from that." $maxBytes $effectiveSize $pvcBytes) }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
The agentserver↔consumer NATS contract: three independent literals that must
each agree for a message to travel end to end at all, none of which either
subchart's own schema can check because each depends on the other chart's
values. All three are checked by plain string equality against each chart's
own default -- both sides ship the SAME default for each pair (see
values.yaml in each chart), so equality catches a drift whether it comes from
an explicit --set on one side, or from one side being left at its default
while only the other is overridden, which is the likely real-world mistake:
an operator moving one side of a pair (e.g. consumer.config.nats.subjectPrefix)
without realizing the other side needs the same change.
*/ -}}
{{- if and .Values.agentserver.enabled .Values.consumer.enabled }}
{{- $agentStream := .Values.agentserver.config.nats.jetstream.stream }}
{{- $consumerStream := .Values.consumer.config.nats.streamName }}
{{- if ne $agentStream $consumerStream }}
{{- fail (printf "agentserver.config.nats.jetstream.stream (%q) differs from consumer.config.nats.streamName (%q): the consumer's durable pull consumer binds to its own streamName, which does not have to be the stream the agentserver actually publishes into. With the two apart, the consumer's consumer either fails to bind (if its named stream does not exist) or binds to an unrelated, empty stream -- either way, every pod stays Ready and no telemetry ever arrives, with nothing naming the cause. Point both at the same stream name." $agentStream $consumerStream) }}
{{- end }}

{{- $agentPrefix := .Values.agentserver.config.nats.subjectPrefix }}
{{- $consumerPrefix := .Values.consumer.config.nats.subjectPrefix }}
{{- if ne $agentPrefix $consumerPrefix }}
{{- fail (printf "agentserver.config.nats.subjectPrefix (%q) differs from consumer.config.nats.subjectPrefix (%q): the agentserver publishes every telemetry message under its own prefix, and the consumer's durable pull consumer filters \"<subjectPrefix>.>\" built from its own. With the two apart, every message the agentserver publishes lands on a subject the consumer never filters for -- every pod stays Ready, /readyz reports every component ok, and telemetry accumulates in the stream until it prunes at max_bytes, with nothing naming the cause. Point both at the same subject prefix." $agentPrefix $consumerPrefix) }}
{{- end }}

{{- if .Values.consumer.config.backpressure.enabled }}
{{- $agentBackpressure := .Values.agentserver.config.nats.backpressureSubject }}
{{- $consumerBackpressure := .Values.consumer.config.backpressure.subject }}
{{- if ne $agentBackpressure $consumerBackpressure }}
{{- fail (printf "agentserver.config.nats.backpressureSubject (%q) differs from consumer.config.backpressure.subject (%q): the consumer publishes write-throttle leases on its own subject, and the agentserver relays whatever arrives on its own configured subject to every connected agent as a BackpressureSignal. With the two apart, a destination refusing writes for a tenant never throttles the agents causing it -- silently, since neither side reports an error, only a write backlog that keeps growing. Point both at the same subject. (Only checked while consumer.config.backpressure.enabled is true -- with it false the consumer publishes no leases at all, which is a deliberate degraded state, not a mismatch.)" $agentBackpressure $consumerBackpressure) }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
The apiserver's read URL and the consumer's write URL for Loki and
VictoriaMetrics must agree, or the log/metrics UI silently reads from a
different backend than the consumer ever writes to -- an empty result set
with /readyz still reporting the read side "ok", because readiness only
checks that the configured URL answers, never that it is the same URL
something else is writing to. Modelled on the Redis/Valkey guard above:
BOTH sides empty is the deliberate "this datastore is not wired up at all"
state (no Loki/VictoriaMetrics install, or an eval install skipping
observability) and is not guarded -- only a difference, including exactly one
side left empty while the other is set, which is worse than two different
non-empty values: one component looks fully configured and healthy while the
other never receives anything to serve.
*/ -}}
{{- if and .Values.apiserver.enabled .Values.consumer.enabled }}
{{- $apiLokiURL := .Values.apiserver.config.upstreams.loki.url }}
{{- $consumerLokiURL := .Values.consumer.config.loki.url }}
{{- if not (and (eq $apiLokiURL "") (eq $consumerLokiURL "")) }}
{{- if ne $apiLokiURL $consumerLokiURL }}
{{- fail (printf "apiserver.config.upstreams.loki.url (%q) differs from consumer.config.loki.url (%q): the apiserver's log API reads from the first, the consumer writes to the second. With the two apart, the log UI returns an empty result set (or logs from the wrong cluster) while /readyz still reports \"loki: ok\", because readiness only checks that the configured URL answers, never that it is the URL anything writes to. Point both at the same Loki instance, or leave BOTH empty if this install does not use Loki at all." $apiLokiURL $consumerLokiURL) }}
{{- end }}
{{- end }}

{{- $apiVMURL := .Values.apiserver.config.upstreams.victoriametrics.url }}
{{- $consumerVMURL := .Values.consumer.config.victoriaMetrics.url }}
{{- if not (and (eq $apiVMURL "") (eq $consumerVMURL "")) }}
{{- if ne $apiVMURL $consumerVMURL }}
{{- fail (printf "apiserver.config.upstreams.victoriametrics.url (%q) differs from consumer.config.victoriaMetrics.url (%q): the apiserver reads metrics from the first, the consumer writes to the second. With the two apart, metrics queries return empty (or metrics from the wrong cluster) while /readyz still reports the read side ok. Point both at the same VictoriaMetrics instance, or leave BOTH empty if this install does not use VictoriaMetrics at all." $apiVMURL $consumerVMURL) }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
The app Ingress enabled without a matching apiserver Ingress on the same
host. The image's API base is relative (/api/v1), baked into the build, not
templated per install -- so a separate apiserver hostname, or no apiserver
Ingress at all, is not merely an unbundled topology, it is UNREACHABLE:
every /api/v1/* request the SPA makes goes to the app's own nginx, which
traps it with `location /api { return 404; }` (confirmed against the real
image). Login fails, every API call 404s, and nothing names the cause. Only
checked when app.ingress.enabled is true; an app not exposed through this
chart's Ingress at all is not this guard's concern.
*/ -}}
{{- if .Values.app.ingress.enabled }}
{{- if not (and .Values.apiserver.enabled .Values.apiserver.ingress.enabled) }}
{{- fail (printf "app.ingress.enabled=true but apiserver.enabled and apiserver.ingress.enabled are not both also true: the image's API base is relative (/api/v1), baked into the build, so with no apiserver Ingress on the same host every /api/v1/* request the SPA makes goes to the app's own nginx, which answers `location /api { return 404; }` -- login fails and every API call 404s, with nothing naming the cause. Set apiserver.enabled=true and apiserver.ingress.enabled=true, with apiserver.ingress.host equal to app.ingress.host (%q)." .Values.app.ingress.host) }}
{{- else if ne .Values.app.ingress.host .Values.apiserver.ingress.host }}
{{- fail (printf "app.ingress.host (%q) differs from apiserver.ingress.host (%q): the image's API base is relative (/api/v1), baked into the build, so a separate apiserver hostname is not merely unbundled, it is UNREACHABLE -- every /api/v1/* request the SPA makes goes to the app's own nginx, which answers `location /api { return 404; }`. Set apiserver.ingress.host to the same value as app.ingress.host." .Values.app.ingress.host .Values.apiserver.ingress.host) }}
{{- end }}
{{- end }}

{{- /*
The app and the apiserver on one host, with the apiserver claiming the root.
nginx resolves a shared host by longest prefix, so an apiserver path of "/" is
not merely ambiguous -- it ties with the app's "/" and the controller picks one
by rules no operator can see, which surfaces as the UI intermittently returning
JSON. Only checked when both Ingresses are enabled on the SAME host; for this
image a DIFFERENT host is not a supported topology at all -- the guard above
already fails that case outright.
*/ -}}
{{- if and .Values.app.enabled .Values.apiserver.enabled .Values.app.ingress.enabled .Values.apiserver.ingress.enabled }}
{{- if eq .Values.app.ingress.host .Values.apiserver.ingress.host }}
{{- if eq .Values.apiserver.ingress.path "/" }}
{{- fail (printf "app.ingress and apiserver.ingress are both enabled on %q, but apiserver.ingress.path is \"/\": that is the same path the web UI claims. nginx merges Ingress objects sharing a host and resolves by longest prefix, so two \"/\" rules for one host leave the controller choosing between them -- the UI answers with JSON, or the API answers with index.html, depending on which rule won. Set apiserver.ingress.path to /api/v1." .Values.app.ingress.host) }}
{{- end }}

{{- /*
Both Ingresses declaring TLS for one host. cert-manager reads each Ingress
independently and opens a Certificate per tls block, both writing the same
Secret: the two orders race, each overwrites the other's key material, and the
symptom is a certificate that intermittently fails validation with nothing in
either Ingress naming the other.
*/ -}}
{{- if and .Values.app.ingress.tls.enabled .Values.apiserver.ingress.tls.enabled }}
{{- fail (printf "app.ingress.tls.enabled and apiserver.ingress.tls.enabled are BOTH true for host %q: two Ingress objects declaring TLS for one host make cert-manager open two Certificates writing the same Secret, which race and overwrite each other. The app Ingress owns TLS for the shared host -- set apiserver.ingress.tls.enabled=false." .Values.app.ingress.host) }}
{{- end }}

{{- /*
apiserver.config.corsAllowedOrigins and apiserver.config.ws.origins left
empty on a bundled, Ingress-exposed install. Neither empty value means "no
cross-origin access" -- ApplyAPIServerDefaults (internal/config/apiserver.go)
turns an empty corsAllowedOrigins into ["*"] at boot, and the WS handshake
sets AllowEmptyOrigin: len(origins) == 0 (internal/apiserver/runner.go),
which disables origin checking entirely for /api/v1/ws. Both then answer
every website on the internet, including the unauthenticated auth/*
endpoints -- nothing renders, logs or warns. Same-origin removes CORS from
the BROWSER's path, never the server's. Scoped to this same-host block, not
unconditional: an install with no Ingress at all here (fronted by a
hand-written Ingress or a service mesh this chart doesn't render) may have
its own reason to leave these unset.
*/ -}}
{{- if not .Values.apiserver.config.corsAllowedOrigins }}
{{- fail (printf "app.ingress and apiserver.ingress are both enabled on %q but apiserver.config.corsAllowedOrigins is empty: ApplyAPIServerDefaults turns an empty list into [\"*\"] at boot, so the apiserver answers Access-Control-Allow-Origin: * to every website on the internet, including the unauthenticated auth/* endpoints -- nothing renders, logs or warns. Set apiserver.config.corsAllowedOrigins to [\"https://%s\"]." .Values.app.ingress.host .Values.app.ingress.host) }}
{{- end }}
{{- if not .Values.apiserver.config.ws.origins }}
{{- fail (printf "app.ingress and apiserver.ingress are both enabled on %q but apiserver.config.ws.origins is empty: the WS handshake sets AllowEmptyOrigin: len(origins) == 0, which disables origin checking entirely for /api/v1/ws, so it upgrades a cross-origin connection from anywhere -- nothing renders, logs or warns. Set apiserver.config.ws.origins to [\"https://%s\"]." .Values.app.ingress.host .Values.app.ingress.host) }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
Postgres disabled, but the apiserver and/or the consumer are still pointed at
the bundled instance's Service name, or still hold the Secret reference
templates/postgres-secret.yaml would have generated. Neither object exists
with postgres disabled: the apiserver's migrate initContainer stops with
CreateContainerConfigError on a Secret that is not there -- and if only the
host was left behind, it instead resolves nothing and crash-loops before the
server starts. The consumer is quieter still: its Postgres writer simply
never connects.
*/ -}}
{{- if not .Values.postgres.enabled }}
{{- $bundledHost := .Values.postgres.serviceName }}
{{- $bundledSecret := printf "%s-auth" .Values.postgres.serviceName }}
{{- if .Values.apiserver.enabled }}
{{- if or (eq .Values.apiserver.config.upstreams.postgres.app.host $bundledHost) (eq .Values.apiserver.config.upstreams.postgres.users.host $bundledHost) }}
{{- fail (printf "postgres.enabled=false but apiserver.config.upstreams.postgres.{app,users}.host is still %q, the bundled Postgres's Service name. That Service is never rendered with postgres disabled, so the migrate initContainer dials a name that resolves to nothing and crash-loops the install before the server starts. Point both hosts at your own Postgres." $bundledHost) }}
{{- end }}
{{- if or (eq .Values.apiserver.secrets.postgresAppPasswordSecret.name $bundledSecret) (eq .Values.apiserver.secrets.postgresUsersPasswordSecret.name $bundledSecret) }}
{{- fail (printf "postgres.enabled=false but apiserver.secrets.postgres{App,Users}PasswordSecret.name is still %q, the Secret templates/postgres-secret.yaml would have generated. That Secret is never rendered with postgres disabled, and the reference is deliberately not optional, so the pod fails with CreateContainerConfigError: secret %q not found. Point both at a Secret you created, or set .name to \"\" and use apiserver.secrets.postgresAppPassword / postgresUsersPassword instead." $bundledSecret $bundledSecret) }}
{{- end }}
{{- end }}
{{- if .Values.consumer.enabled }}
{{- if or (eq .Values.consumer.config.postgres.host $bundledHost) (eq .Values.consumer.config.usersDb.host $bundledHost) }}
{{- fail (printf "postgres.enabled=false but consumer.config.{postgres,usersDb}.host is still %q, the bundled Postgres's Service name. The consumer's writers then never connect and its readiness never turns ready, with nothing naming Postgres as the cause. Point both at your own Postgres." $bundledHost) }}
{{- end }}
{{- if or (eq .Values.consumer.secrets.postgresPasswordSecret.name $bundledSecret) (eq .Values.consumer.secrets.usersDbPasswordSecret.name $bundledSecret) }}
{{- fail (printf "postgres.enabled=false but consumer.secrets.{postgresPasswordSecret,usersDbPasswordSecret}.name is still %q, the Secret templates/postgres-secret.yaml would have generated. That Secret is never rendered with postgres disabled, and kubexa-consumer's secretKeyRef is deliberately not optional (same contract as the apiserver's), so the pod fails outright with CreateContainerConfigError: secret %q not found -- the container never starts, so /healthz and /readyz never even run and nothing distinguishes this from any other pull-image or scheduling failure. This chart owns no Secret of its own to fall back to: point both at a Secret you created, or set .name to \"\" to leave that credential unset." $bundledSecret $bundledSecret) }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
sslMode left at `disable` while pointed at a Postgres this chart did not
bundle. `disable` is correct for the bundled instance -- a ClusterIP Service
with no certificate -- and wrong for anything reached across a network: the
connection succeeds and the credentials and every row cross the wire in
clear. The apiserver chart's own default is `require`, so this state can only
be reached by leaving this chart's bundled-instance value behind. The
consumer's own sslMode default is also `disable`, with no bundled-instance
qualifier at all in kubexa-consumer's own values.yaml -- it reaches a
networked Postgres in clear exactly the same way, just through a different
component: its telemetry writer and its usersDb registry lookups, not the
apiserver's API.
*/ -}}
{{- if and (not .Values.postgres.enabled) .Values.apiserver.enabled }}
{{- if or (eq .Values.apiserver.config.upstreams.postgres.app.sslMode "disable") (eq .Values.apiserver.config.upstreams.postgres.users.sslMode "disable") }}
{{- fail "postgres.enabled=false but apiserver.config.upstreams.postgres.{app,users}.sslMode is still \"disable\", the value this chart sets for the bundled instance because it is a ClusterIP Service with no certificate. Against a Postgres reached over a network that setting sends the password and every row in clear. Set both to \"require\" (the apiserver chart's own default) or to \"verify-full\" with a root certificate." }}
{{- end }}
{{- end }}
{{- if and (not .Values.postgres.enabled) .Values.consumer.enabled }}
{{- if or (eq .Values.consumer.config.postgres.sslMode "disable") (eq .Values.consumer.config.usersDb.sslMode "disable") }}
{{- fail "postgres.enabled=false but consumer.config.{postgres,usersDb}.sslMode is still \"disable\", the value this chart sets for the bundled instance because it is a ClusterIP Service with no certificate. Against a Postgres reached over a network that setting sends the telemetry writer's and the usersDb registry lookup's password, and every row either writes or reads, in clear. Set both to \"require\" or to \"verify-full\" with a root certificate." }}
{{- end }}
{{- end }}

{{- /*
VictoriaMetrics disabled with the bundled endpoint left behind. The
consumer's remote-write silently retries into a name that resolves to
nothing, and the apiserver's metric screens answer with an error the UI shows
as an empty chart -- which is exactly the "a failed query became a zero"
failure this product has a rule against.

The bundled URL is built from victoriaMetrics.server.fullnameOverride, not a
top-level victoriaMetrics.fullnameOverride: this chart's "vm.plain.fullname"
helper always suffixes a top-level override with "-server" (see the comment
on victoriaMetrics.server.fullnameOverride in values.yaml), so the override
that actually names the rendered Service lives under .server.
*/ -}}
{{- if not .Values.victoriaMetrics.enabled }}
{{- $bundledVM := printf "http://%s:8428" .Values.victoriaMetrics.server.fullnameOverride }}
{{- if and .Values.consumer.enabled (eq .Values.consumer.config.victoriaMetrics.url $bundledVM) }}
{{- fail (printf "victoriaMetrics.enabled=false but consumer.config.victoriaMetrics.url is still %q, the bundled instance's Service name. Point it at your own VictoriaMetrics, or set it to \"\" to disable the writer deliberately." $bundledVM) }}
{{- end }}
{{- if and .Values.apiserver.enabled (eq .Values.apiserver.config.upstreams.victoriametrics.url $bundledVM) }}
{{- fail (printf "victoriaMetrics.enabled=false but apiserver.config.upstreams.victoriametrics.url is still %q, the bundled instance's Service name. Point it at your own VictoriaMetrics, or set it to \"\" -- an empty url disables the upstream, which is an honest \"not configured\" rather than a query that fails on every screen." $bundledVM) }}
{{- end }}
{{- end }}

{{- /*
Loki disabled with the bundled endpoint left behind, and the reverse: a Loki
url with no users database. The consumer's Validate() refuses the second
combination outright, and the refusal is a line in a log nobody reads until
logs stop arriving.
*/ -}}
{{- if not .Values.loki.enabled }}
{{- $bundledLoki := printf "http://%s:3100" .Values.loki.fullnameOverride }}
{{- if and .Values.consumer.enabled (eq .Values.consumer.config.loki.url $bundledLoki) }}
{{- fail (printf "loki.enabled=false but consumer.config.loki.url is still %q, the bundled instance's Service name. Point it at your own Loki, or set it to \"\" to disable the writer deliberately." $bundledLoki) }}
{{- end }}
{{- if and .Values.apiserver.enabled (eq .Values.apiserver.config.upstreams.loki.url $bundledLoki) }}
{{- fail (printf "loki.enabled=false but apiserver.config.upstreams.loki.url is still %q, the bundled instance's Service name. Point it at your own Loki, or set it to \"\"." $bundledLoki) }}
{{- end }}
{{- end }}

{{- /*
A Loki url with no users database. Independent of whether Loki is bundled:
the consumer resolves each cluster's namespace into the X-Scope-OrgID every
push carries, and that lookup is the users database. Its Validate() refuses
the combination and the process exits.
*/ -}}
{{- if and .Values.consumer.enabled .Values.consumer.config.loki.url }}
{{- if not .Values.consumer.config.usersDb.host }}
{{- fail "consumer.config.loki.url is set but consumer.config.usersDb.host is empty. Loki pushes carry X-Scope-OrgID resolved from the users database, so the consumer's Validate() refuses this combination and the process exits at boot. Fill in consumer.config.usersDb, or clear loki.url." }}
{{- end }}
{{- end }}
