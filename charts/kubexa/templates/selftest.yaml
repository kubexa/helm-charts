{{- if .Values.selftest.enabled }}
{{- /*
One Job and nothing else: no ServiceAccount, Role, ClusterRole or bindings.
The self-test never touches the Kubernetes API; it talks to the product's own
endpoints over in-cluster Service DNS, so it runs as the namespace's default
ServiceAccount with no token worth having.

No Helm hook annotations, on purpose and permanently. This is not a
post-install hook: a hook that fails fails the release, and this Job is a
report to read, run by hand.

Every name below is built from .Release.Name and the subchart alias by
"kubexa.subchartFullname" -- never by calling a subchart helper, which would
evaluate against the umbrella's values. tests/render.sh pins the result
against the rendered Deployments.
*/ -}}
{{- $apiName := include "kubexa.subchartFullname" (dict "root" . "alias" "apiserver" "values" .Values.apiserver) }}
{{- $agentName := include "kubexa.subchartFullname" (dict "root" . "alias" "agentserver" "values" .Values.agentserver) }}
{{- $consumerName := include "kubexa.subchartFullname" (dict "root" . "alias" "consumer" "values" .Values.consumer) }}
{{- $api := .Values.apiserver }}
{{- $agent := .Values.agentserver }}
{{- $consumer := .Values.consumer }}
{{- $apiSecrets := $api.secrets | default dict }}
{{- $apiKeys := ternary $apiSecrets.existingSecret (printf "%s-keys" $apiName) (not (empty $apiSecrets.existingSecret)) }}
{{- $apiConfigSecret := ternary $api.configSecret.existingSecret (printf "%s-config" $apiName) (not (empty (($api.configSecret).existingSecret))) }}
{{- $agentConfigSecret := ternary $agent.configSecret.existingSecret (printf "%s-config" $agentName) (not (empty (($agent.configSecret).existingSecret))) }}
{{- $apiHTTPPort := (($api.service).httpPort) | default 8080 }}
{{- /* The AGENT-FACING port (service.grpcPort), never adminPort: both
listeners register grpc_health_v1, so a target on the admin port passes while
the door an agent actually uses is shut. */ -}}
{{- $agentGRPCPort := (($agent.service).grpcPort) | default 9090 }}
{{- $consumerAdminPort := (($consumer.service).adminPort) | default 8082 }}
{{- /* Coupled to the consumer subchart's own values: see selftest in values.yaml. */ -}}
{{- $flush := dig "config" "writers" "flushInterval" "1s" $consumer }}
{{- $durable := dig "config" "nats" "consumer" "name" "kubexa-consumer" $consumer }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubexa.selftestFullname" . }}
  labels:
    app.kubernetes.io/name: kubexa-selftest
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  # 0, not the default 6: a retry would send a second test message and print a
  # second report under the first.
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.selftest.activeDeadlineSeconds }}
  {{- with .Values.selftest.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubexa-selftest
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: selftest
          image: "{{ .Values.selftest.image.repository }}:{{ .Values.selftest.image.tag }}"
          imagePullPolicy: {{ .Values.selftest.image.pullPolicy }}
          command: ["/kubexa-selftest"]
          args:
            - --namespace={{ .Release.Namespace }}
            - --apiserver-config=/etc/kubexa/apiserver/config.yaml
            - --agentserver-config=/etc/kubexa/agentserver/config.yaml
            - --apiserver-url=http://{{ $apiName }}.{{ .Release.Namespace }}.svc:{{ $apiHTTPPort }}
            - --agentserver-target={{ $agentName }}.{{ .Release.Namespace }}.svc:{{ $agentGRPCPort }}
            {{- if $consumer.enabled }}
            - --consumer-metrics-url={{ default (printf "http://%s.%s.svc:%v/metrics" $consumerName .Release.Namespace $consumerAdminPort) .Values.selftest.consumerMetricsURL }}
            {{- else if .Values.selftest.consumerMetricsURL }}
            - --consumer-metrics-url={{ .Values.selftest.consumerMetricsURL }}
            {{- end }}
            - --consumer-flush-interval={{ $flush }}
            - --consumer-durable={{ $durable }}
            {{- with .Values.selftest.login.email }}
            - --login-email={{ . }}
            {{- end }}
            {{- if .Values.selftest.login.existingSecret }}
            # Kubernetes expands $(VAR) from the container env, so the password
            # reaches the process without being written into the pod spec.
            - --login-password=$(SELFTEST_LOGIN_PASSWORD)
            {{- end }}
            {{- with .Values.selftest.mailTo }}
            - --mail-to={{ . }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.selftest.login.existingSecret }}
            - name: SELFTEST_LOGIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.selftest.login.existingSecret }}
                  key: {{ .Values.selftest.login.passwordKey }}
            {{- end }}
            # The apiserver's credentials, mirrored from its Deployment with the
            # same secretKeyRef. All optional here even where the Deployment is
            # not: a missing Secret must produce a report naming what is
            # missing, not a pod stuck in CreateContainerConfigError.
            #
            # The two bootstrap fields are yaml:"-" in the config struct: they
            # reach the process ONLY through the environment, so omitting them
            # makes the login SKIP. PLATFORM_SETTINGS_KEY is the sealer: without
            # it the mail check cannot resolve the stored provider and SKIPs
            # rather than guess from the yaml.
            {{- range $env, $key := dict "KUBEXA_APISERVER_AUTH_SYMMETRIC_KEY" "auth-symmetric-key" "KUBEXA_APISERVER_LOKI_PASSWORD" "loki-password" "KUBEXA_APISERVER_VM_PASSWORD" "vm-password" "KUBEXA_APISERVER_MAIL_API_KEY" "mail-api-key" "KUBEXA_APISERVER_INTERNAL_TOKEN" "internal-token" "KUBEXA_APISERVER_BOOTSTRAP_SUPERADMIN_EMAIL" "bootstrap-superadmin-email" "KUBEXA_APISERVER_BOOTSTRAP_SUPERADMIN_PASSWORD" "bootstrap-superadmin-password" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $apiKeys }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            - name: KUBEXA_APISERVER_PLATFORM_SETTINGS_KEY
              valueFrom:
                secretKeyRef:
                  {{- if (($apiSecrets.platformKeySecret).name) }}
                  name: {{ $apiSecrets.platformKeySecret.name }}
                  key: {{ $apiSecrets.platformKeySecret.key }}
                  {{- else }}
                  name: {{ $apiKeys }}
                  key: platform-settings-key
                  {{- end }}
                  optional: true
            - name: KUBEXA_APISERVER_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if (($apiSecrets.redisPasswordSecret).name) }}
                  name: {{ $apiSecrets.redisPasswordSecret.name }}
                  key: {{ $apiSecrets.redisPasswordSecret.key }}
                  {{- else }}
                  name: {{ $apiKeys }}
                  key: redis-password
                  {{- end }}
                  optional: true
            - name: KUBEXA_APISERVER_POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if (($apiSecrets.postgresAppPasswordSecret).name) }}
                  name: {{ $apiSecrets.postgresAppPasswordSecret.name }}
                  key: {{ $apiSecrets.postgresAppPasswordSecret.key }}
                  {{- else }}
                  name: {{ $apiKeys }}
                  key: postgres-app-password
                  {{- end }}
                  optional: true
            - name: KUBEXA_APISERVER_POSTGRES_USERS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if (($apiSecrets.postgresUsersPasswordSecret).name) }}
                  name: {{ $apiSecrets.postgresUsersPasswordSecret.name }}
                  key: {{ $apiSecrets.postgresUsersPasswordSecret.key }}
                  {{- else }}
                  name: {{ $apiKeys }}
                  key: postgres-users-password
                  {{- end }}
                  optional: true
            # The agentserver's credentials, by reference as its Deployment
            # declares them -- only when it declares them.
            {{- if (($agent.secrets).redisPasswordSecret).name }}
            - name: KUBEXA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $agent.secrets.redisPasswordSecret.name }}
                  key: {{ $agent.secrets.redisPasswordSecret.key }}
                  optional: true
            {{- end }}
            {{- if (($agent.secrets).natsPasswordSecret).name }}
            - name: KUBEXA_AGENTSERVER_NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $agent.secrets.natsPasswordSecret.name }}
                  key: {{ $agent.secrets.natsPasswordSecret.key }}
                  optional: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.selftest.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: apiserver-config
              mountPath: /etc/kubexa/apiserver
              readOnly: true
            - name: agentserver-config
              mountPath: /etc/kubexa/agentserver
              readOnly: true
      volumes:
        # optional: a missing Secret yields the report that says so, not a pod
        # that never starts. The Secrets hold the key apiserver.yaml /
        # agentserver.yaml; items renames it to the config.yaml the binary's
        # flag defaults name.
        - name: apiserver-config
          secret:
            secretName: {{ $apiConfigSecret }}
            optional: true
            items:
              - key: apiserver.yaml
                path: config.yaml
        - name: agentserver-config
          secret:
            secretName: {{ $agentConfigSecret }}
            optional: true
            items:
              - key: agentserver.yaml
                path: config.yaml
{{- end }}
