{{- if .Values.postgres.enabled }}
{{- $name := printf "%s-auth" (include "kubexa.postgresFullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := default dict (default dict $existing).data }}
{{- $super := .Values.postgres.superuserPassword }}
{{- if not $super }}
{{- if index $data "postgres-password" }}
{{- $super = index $data "postgres-password" | b64dec }}
{{- else }}
{{- $super = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- $app := .Values.postgres.appPassword }}
{{- if not $app }}
{{- if index $data "app-password" }}
{{- $app = index $data "app-password" | b64dec }}
{{- else }}
{{- $app = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- $users := .Values.postgres.usersPassword }}
{{- if not $users }}
{{- if index $data "users-password" }}
{{- $users = index $data "users-password" | b64dec }}
{{- else }}
{{- $users = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubexa.postgresLabels" . | nindent 4 }}
  annotations:
    # The lookup above covers `helm upgrade`. It does NOT cover uninstall
    # followed by install, and that gap was measured on 2026-10-12 against a
    # fresh k3d cluster: `helm uninstall` deletes this Secret but leaves
    # data-<fullname>-0 Bound, so the next install finds nothing to read back
    # and generates new passwords, while the roles on the surviving volume
    # keep the old ones -- the init script runs only on an empty PGDATA.
    # Nothing notices. `helm install --wait` exited 0 with all six pods
    # Ready, because this StatefulSet's probe is `pg_isready -U postgres -h
    # 127.0.0.1`, which the image's own pg_hba answers over a `trust` line;
    # the first component to connect over the Service got
    # `FATAL: password authentication failed for user "kubexa_app"`.
    #
    # keep ties this Secret's lifetime to the volume whose contents it
    # describes, which is what it always should have been: the password is
    # part of that data, not part of the release. The cost is explicit --
    # uninstall now leaves a Secret holding credentials behind, exactly as it
    # already leaves the PVC holding the rows. Deleting the namespace
    # reclaims both together, which is the documented teardown.
    #
    # A reinstall under the SAME release name and namespace adopts this
    # Secret (Helm matches its own meta.helm.sh/release-* annotations). Under
    # a DIFFERENT release name it fails loudly instead, which is correct: the
    # data on that volume answers to the password in here, not to a new one.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Each password is read back from this same Secret on upgrade. Regenerating
  # any of them would leave the database holding the old one -- the roles are
  # created once, by the init script, and never re-ALTERed -- with no error
  # until the first connection.
  postgres-password: {{ $super | quote }}
  app-password: {{ $app | quote }}
  users-password: {{ $users | quote }}
{{- end }}
