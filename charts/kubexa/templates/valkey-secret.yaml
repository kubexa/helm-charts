{{- if .Values.valkey.enabled }}
{{- $name := printf "%s-auth" (include "kubexa.valkeyFullname" .) }}
{{- $password := .Values.valkey.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (index (default dict $existing.data) "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubexa.valkeyLabels" . | nindent 4 }}
type: Opaque
stringData:
  # Read back from this Secret on upgrade. Regenerating it would leave the
  # apiserver holding the old password with no error until the first command.
  password: {{ $password | quote }}
{{- end }}
