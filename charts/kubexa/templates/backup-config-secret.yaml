{{- if .Values.backup.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-config" (include "kubexa.backupFullname" .) }}
  labels:
    {{- include "kubexa.backupLabels" . | nindent 4 }}
type: Opaque
stringData:
  # The backup job reads the apiserver's own upstream block, rendered from the
  # same values the apiserver subchart is given. Two copies of a connection
  # would let the backup keep dumping a database the apiserver has left --
  # succeeding every night while protecting nothing.
  #
  # Rendered field by field, NOT `toYaml .Values.apiserver.config.upstreams.
  # postgres` -- that dumps the values-shape camelCase keys (user, sslMode,
  # maxConns, minConns) straight through, but the binary's config.Load()
  # unmarshals into the same Go struct as the apiserver
  # (internal/config/apiserver.go's PostgresUpstream), whose yaml tags are
  # snake_case (username, ssl_mode, max_conns, min_conns) with `user`
  # specifically renamed to `username`. yaml.Unmarshal there is not strict, so
  # a plain `user` key is silently dropped instead of erroring, leaving Username
  # empty and every nightly run authenticating as nothing. Mirrors
  # charts/kubexa-apiserver/templates/secret.yaml's own postgres block, which
  # carries the identical comment next to its own `username:` line.
  backup.yaml: |
    apiserver:
      upstreams:
        postgres:
          app:
            host: {{ .Values.apiserver.config.upstreams.postgres.app.host | quote }}
            port: {{ .Values.apiserver.config.upstreams.postgres.app.port }}
            database: {{ .Values.apiserver.config.upstreams.postgres.app.database | quote }}
            username: {{ .Values.apiserver.config.upstreams.postgres.app.user | quote }}
            password: {{ .Values.apiserver.config.upstreams.postgres.app.password | quote }}
            ssl_mode: {{ .Values.apiserver.config.upstreams.postgres.app.sslMode | quote }}
            max_conns: {{ .Values.apiserver.config.upstreams.postgres.app.maxConns }}
            min_conns: {{ .Values.apiserver.config.upstreams.postgres.app.minConns }}
          users:
            host: {{ .Values.apiserver.config.upstreams.postgres.users.host | quote }}
            port: {{ .Values.apiserver.config.upstreams.postgres.users.port }}
            database: {{ .Values.apiserver.config.upstreams.postgres.users.database | quote }}
            username: {{ .Values.apiserver.config.upstreams.postgres.users.user | quote }}
            password: {{ .Values.apiserver.config.upstreams.postgres.users.password | quote }}
            ssl_mode: {{ .Values.apiserver.config.upstreams.postgres.users.sslMode | quote }}
            max_conns: {{ .Values.apiserver.config.upstreams.postgres.users.maxConns }}
            min_conns: {{ .Values.apiserver.config.upstreams.postgres.users.minConns }}
{{- end }}
