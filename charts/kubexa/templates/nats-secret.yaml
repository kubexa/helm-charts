{{- if .Values.nats.enabled }}
{{- $name := "kubexa-nats-auth" }}
{{- $password := .Values.nats.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (index (default dict $existing.data) "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubexa.natsLabels" . | nindent 4 }}
type: Opaque
stringData:
  # Read back from this Secret on upgrade. Regenerating it would leave the
  # agentserver and the consumer holding the old password with no error until
  # the first command each sends against an authenticated NATS.
  password: {{ $password | quote }}
{{- end }}
