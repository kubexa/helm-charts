name: Umbrella Chart Release

on:
  push:
    branches: ["main"]
    paths:
      - "charts/kubexa/**"
      - ".github/workflows/umbrella-release.yaml"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART_PATH: charts/kubexa
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to the same version kubexa-backend's chart jobs use: two
      # renderers producing two different manifests from one chart is a class
      # of bug nobody looks for.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2

      # Same version and install shape as kubexa-backend's own `chart` CI
      # job (.github/workflows/ci.yml): tests/render.sh's kubeconform
      # assertion needs it on PATH the same way that job does.
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # Resolved BEFORE logging in, and the order is load-bearing. The
      # component charts are public, so an anonymous pull works -- but
      # GITHUB_TOKEN is scoped to THIS repository, and the packages belong to
      # kubexa-backend. Presenting it does not fall back to public access; the
      # registry answers 403 for a package anyone else can read:
      #
      #   GET .../charts/kubexa-apiserver/manifests/0.2.0: 403 denied
      #
      # Logging in later costs nothing: the login is only needed to push.
      - name: Resolve dependencies
        run: helm dependency update $CHART_PATH

      # No --set overrides: the chart renders its own defaults now (the
      # bundled Postgres), which is the exact defect this branch closed --
      # the two pg.example.com overrides that used to be required here are
      # gone for the same reason.
      - name: Lint
        run: |
          helm lint $CHART_PATH \
            --set apiserver.config.upstreams.agentserver.controlAddr=agentserver.example.com:50052

      - name: Render
        run: |
          helm template kubexa $CHART_PATH \
            --set apiserver.config.upstreams.agentserver.controlAddr=agentserver.example.com:50052 \
            > /dev/null

      # Asserts both that the render FAILED and that it failed with the
      # guard's OWN message, so an unrelated typo elsewhere in the chart can't
      # be misread as this guard firing.
      - name: refuses the apiserver claiming / on the app's host
        run: |
          out=$(helm template kubexa $CHART_PATH \
            --set app.ingress.enabled=true --set app.ingress.host=kubexa.example.com \
            --set apiserver.ingress.enabled=true --set apiserver.ingress.host=kubexa.example.com \
            --set apiserver.ingress.path=/ 2>&1) && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "the apiserver claiming / on the app's host rendered; the guard is gone" >&2
            exit 1
          fi
          if ! grep -q "apiserver.ingress.path is" <<<"$out"; then
            echo "render failed, but not because of the path guard. Got:" >&2
            echo "$out" >&2
            exit 1
          fi

      # Same shape as the guard above, for the TLS pair.
      - name: refuses two TLS declarations for one host
        run: |
          out=$(helm template kubexa $CHART_PATH \
            --set app.ingress.enabled=true --set app.ingress.host=kubexa.example.com \
            --set app.ingress.tls.enabled=true --set app.ingress.tls.secretName=kubexa-tls \
            --set apiserver.ingress.enabled=true --set apiserver.ingress.host=kubexa.example.com \
            --set apiserver.ingress.tls.enabled=true --set apiserver.ingress.tls.secretName=kubexa-tls 2>&1) && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "two TLS declarations for one host rendered; the guard is gone" >&2
            exit 1
          fi
          if ! grep -q "BOTH true for host" <<<"$out"; then
            echo "render failed, but not because of the TLS guard. Got:" >&2
            echo "$out" >&2
            exit 1
          fi

      # The full harness: every profile in tests/profiles/ against every
      # assertion, including that each half-thrown-* profile fails with its
      # OWN guard's message, not some other guard's. Nothing above this line
      # renders the shipping default, runs kubeconform, or touches
      # external-stores or any half-thrown-* profile -- this is what actually
      # gates the package/push steps below on the chart this branch built.
      - name: Run the chart test harness
        run: charts/kubexa/tests/render.sh

      - name: Get chart name and version
        id: chart_version
        run: |
          echo "name=$(grep '^name:' $CHART_PATH/Chart.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "version=$(grep '^version:' $CHART_PATH/Chart.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Package chart
        run: |
          rm -rf dist && mkdir -p dist
          helm package $CHART_PATH --destination dist \
            --version ${{ steps.chart_version.outputs.version }}

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login $REGISTRY \
            -u ${{ github.actor }} \
            --password-stdin

      # The exact filename, never a glob: `helm push` reads its second argument
      # as the remote, so a second .tgz in dist/ silently becomes the
      # destination instead of the registry.
      - name: Push to GHCR (OCI)
        run: |
          helm push \
            "dist/${{ steps.chart_version.outputs.name }}-${{ steps.chart_version.outputs.version }}.tgz" \
            "oci://$REGISTRY/${IMAGE_NAMESPACE}/charts"
